    ctx.beginPath();
    ctx.moveTo(-18, by - 10);
    ctx.lineTo(22, by - 62);
    ctx.stroke();
    ctx.fillStyle = '#2b2438';
    ctx.fillRect(2, by - 50, 12, 6);
  }
  // 身子（外套）
  roundRect(ctx, -17, by - 48, 34, 50, 10);
  ctx.fillStyle = look.jacket;
  ctx.fill();
  ink(ctx, 3);
  ctx.stroke();
  if (o.team) {
    // 队服胸口一道条
    ctx.fillStyle = o.team;
    ctx.fillRect(-17, by - 30, 34, 6);
  }
  // 胳膊
  ctx.strokeStyle = look.jacket;
  ctx.lineWidth = 9;
  const armA = run ? Math.sin(ph + Math.PI) * 0.9 : o.cheer ? -2.6 : 0.15;
  const armB = run ? Math.sin(ph) * 0.9 : o.cheer ? 2.6 : -0.15;
  [[-15, armA], [15, armB]].forEach(([sx, ang]) => {
    ctx.beginPath();
    ctx.moveTo(sx, by - 42);
    ctx.lineTo(sx + Math.sin(ang) * 26, by - 42 + Math.cos(ang) * 26);
    ctx.stroke();
  });
  // 头
  const hy = by - 64;
  ctx.fillStyle = look.skin;
  ctx.beginPath();
  ctx.arc(0, hy, 15, 0, Math.PI * 2);
  ctx.fill();
  ink(ctx, 3);
  ctx.stroke();
  hair(ctx, hy, look, o.back);
  if (!o.back) {
    ctx.fillStyle = INK;
    ctx.fillRect(-7, hy - 1, 3, 4);
    ctx.fillRect(4, hy - 1, 3, 4);
    if (o.smile) {
      ctx.beginPath();
      ctx.arc(0, hy + 4, 5, 0.2, Math.PI - 0.2);
      ink(ctx, 2);
      ctx.stroke();
    }
  }
  if (o.headset) {
    ink(ctx, 4);
    ctx.beginPath();
    ctx.arc(0, hy - 2, 17, Math.PI * 1.05, Math.PI * 1.95);
    ctx.stroke();
    ctx.fillStyle = '#2b2438';
    ctx.fillRect(-20, hy - 6, 7, 12);
    ctx.fillRect(13, hy - 6, 7, 12);
  }
  ctx.restore();
}

function hair(ctx, hy, look, back) {
  ctx.fillStyle = look.hair;
  ink(ctx, 2.5);
  ctx.beginPath();
  if (look.style === 'beanie') {
    ctx.arc(0, hy - 2, 16, Math.PI, 0);
    ctx.lineTo(16, hy + 1);
    ctx.lineTo(-16, hy + 1);
    ctx.closePath();
    ctx.fillStyle = '#3a3150';
  } else if (look.style === 'ponytail') {
    ctx.arc(0, hy - 2, 16, Math.PI * 0.9, Math.PI * 2.1);
    ctx.quadraticCurveTo(24, hy + 4, 20, hy + 26);
    ctx.quadraticCurveTo(14, hy + 8, 12, hy - 4);
    ctx.lineTo(-14, hy - 2);
    ctx.closePath();
  } else if (look.style === 'spiky') {
    ctx.moveTo(-16, hy - 2);
    for (let i = 0; i <= 6; i++) ctx.lineTo(-16 + i * 5.3, hy - (i % 2 ? 26 : 14));
    ctx.lineTo(16, hy - 2);
    ctx.closePath();
  } else if (look.style === 'cap') {
    ctx.arc(0, hy - 3, 16, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.rect(back ? -22 : -4, hy - 6, 26, 5);
  } else if (look.style === 'buzz') {
    ctx.arc(0, hy - 3, 15.5, Math.PI * 1.05, Math.PI * 1.95);
    ctx.closePath();
  } else {
    ctx.arc(0, hy - 3, 16, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
  }
  if (back) {
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, hy, 15, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.stroke();
}

function sky(ctx, L, stops, y0, y1, x0) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, stops[0]);
  g.addColorStop(0.6, stops[1]);
  g.addColorStop(1, stops[2]);
  ctx.fillStyle = g;
  ctx.fillRect(x0 || 0, y0, L.W - 2 * (x0 || 0), y1 - y0);
}

function speedLines(ctx, L, t, color) {
  ctx.strokeStyle = color || 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    const y = ((i * 97) % L.H);
    const x = L.W - (((t * 900 + i * 173) % (L.W + 200)));
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 60 + (i % 3) * 30, y);
    ctx.stroke();
  }
}

// 圆形转场：黑幕从四周收成狙击镜的圆（k=0 全开，k=1 收到镜子那么大）
function iris(ctx, L, cx, cy, r) {
  // 用一圈很粗的描边当黑幕（微信的 canvas 不一定支持 evenodd 挖洞）
  const R = Math.hypot(L.W, L.H) + 20;
  if (r >= R) return;
  ctx.save();
  ctx.strokeStyle = '#120c1c';
  ctx.lineWidth = R - r;
  ctx.beginPath();
  ctx.arc(cx, cy, r + (R - r) / 2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

// —— 开场：标题字 ——
function logo(ctx, L, t) {
  const k = pop(t / 0.6);
  ctx.save();
  ctx.translate(L.W / 2, L.H * 0.14);
  ctx.rotate(-0.06);
  ctx.scale(k, k);
  starburst(ctx, 0, 0, 112, 78, 16, '#e3263b');
  comicText(ctx, '瓦西里', 0, -2, 54);
  ctx.restore();
}

// —— 换位置：从上一个点跑到下一个点（约 2.4 秒）——
// th：下一个点的主题（用它的天空和楼的颜色）
const RELOCATE_SEC = 2.4;
function relocate(ctx, L, t, th, scopeC, D) {
  sky(ctx, L, th.sky, 0, L.H);
  const roofY = L.H * 0.64;
  // 远处的楼往后跑
  ctx.fillStyle = th.far.color;
  for (let i = 0; i < 10; i++) {
    const w = 50 + ((i * 37) % 40);
    const h = 80 + ((i * 53) % 120);
    const x = ((i * 70 - t * 120) % (L.W + 140) + L.W + 140) % (L.W + 140) - 70;
    ctx.fillRect(x, roofY - h - 30, w, h + 40);
  }
  // 脚下的屋顶：两栋楼中间有个缺口，要跳过去
  const scroll = t * 260;
  const gapX = L.W * 0.55 + 260 * 1.05 - scroll; // 约 1.05 秒时缺口跑到人脚下
  const pal = th.pal[0];
  ctx.fillStyle = pal[1];
  ctx.fillRect(-10, roofY, gapX + 10, L.H);
  ctx.fillRect(gapX + 70, roofY - 10, L.W * 3, L.H);
  ink(ctx, 3);
  ctx.strokeRect(-10, roofY, gapX + 10, L.H);
  ctx.strokeRect(gapX + 70, roofY - 10, L.W * 3, L.H);
  ctx.fillStyle = pal[0];
  for (let i = 0; i < 12; i++) {
    const wx = ((i * 55 - scroll) % 660 + 660) % 660 - 40;
    if ((wx > -20 && wx < gapX - 30) || wx > gapX + 80) ctx.fillRect(wx, roofY + 40, 18, 24);
  }
  speedLines(ctx, L, t);

  // 人：跑、在缺口处跳、落地蹲下举枪
  const px = L.W * 0.38;
  let py = roofY;
  let pose = 'run';
  const jumpT = (t - 0.75) / 0.6;
  if (jumpT > 0 && jumpT < 1) py = roofY - 10 * jumpT - Math.sin(jumpT * Math.PI) * 70;
  else if (jumpT >= 1) py = roofY - 10;
  if (t > 1.75) pose = 'sit';
  person(ctx, px, py, 0.9, ME, { pose, phase: t * 16, rifle: true });
  if (jumpT > 0.95 && jumpT < 1.3) {
    comicText(ctx, '咚', px + 40, py - 20, 26 * ease((jumpT - 0.95) / 0.1));
  }

  comicText(ctx, '换个点位', L.W / 2, 70, 30 * pop(t / 0.4));

  // 最后收成狙击镜
  if (t > 1.9) {
    const k = ease((t - 1.9) / 0.5);
    iris(ctx, L, scopeC.x, scopeC.y, lerp(L.H, D / 2, k));
  }
}

// —— 一场打完（约 3 秒）：网吧大屏亮比分，观众跳 ——
const CLEAR_SEC = 3;
function matchClear(ctx, L, t, matchNo, total, crowd) {
  ctx.fillStyle = '#1a1030';
  ctx.fillRect(0, 0, L.W, L.H);
  // 大屏
  const sw = L.W * 0.84;
  const sh = 170;
  const sx = (L.W - sw) / 2;
  const sy = L.H * 0.16;
  ctx.fillStyle = 'rgba(120,200,255,' + (0.15 + 0.1 * Math.sin(t * 8)).toFixed(2) + ')';
  ctx.fillRect(sx - 14, sy - 14, sw + 28, sh + 28);
  roundRect(ctx, sx, sy, sw, sh, 8);
  ctx.fillStyle = '#0d2238';
  ctx.fill();
  ink(ctx, 5);
  ctx.stroke();
  // 比分翻牌
  const flip = ease((t - 0.3) / 0.35);
  ctx.save();
  ctx.translate(L.W / 2, sy + sh / 2 + 10);
  ctx.scale(1, Math.abs(Math.cos((1 - flip) * Math.PI)) || 0.02);
  const shown = flip < 0.5 ? matchNo - 1 : matchNo;
  comicText(ctx, shown + ' : 0', 0, 0, 64, '#ffffff', '#0d2238');
  ctx.restore();
  // 三个点：第几场
  for (let i = 0; i < total; i++) {
    ctx.beginPath();
    ctx.arc(L.W / 2 - (total - 1) * 16 + i * 32, sy + 30, 8, 0, Math.PI * 2);
    ctx.fillStyle = i < matchNo ? '#ffd23f' : '#33445a';
    ctx.fill();
    ink(ctx, 2);
    ctx.stroke();
  }
  // 一排排电脑屏
  for (let row = 0; row < 3; row++) {
    const y = L.H * 0.56 + row * 60;
    const n = 5 + row;
    for (let i = 0; i < n; i++) {
      const w = (L.W / n) * 0.7;
      const x = (L.W / n) * (i + 0.15);
      ctx.fillStyle = 'rgba(90,200,255,' + (0.35 + row * 0.15).toFixed(2) + ')';
      ctx.fillRect(x, y, w, 26 + row * 6);
      ink(ctx, 2);
      ctx.strokeRect(x, y, w, 26 + row * 6);
    }
  }
  // 观众的头，一起跳
  const heads = Math.min(18, 8 + Math.floor(crowd / 20));
  for (let i = 0; i < heads; i++) {
    const x = ((i + 0.5) / heads) * L.W;
    const jump = Math.max(0, Math.sin(t * 9 + i * 1.3)) * 14 * ease((t - 0.5) / 0.3);
    const y = L.H - 40 - (i % 2) * 18 - jump;
    ctx.fillStyle = '#0a0612';
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(x - 22, y + 12, 44, 60);
    if (i % 3 === 0) {
      ctx.fillRect(x + 12, y - 30 - jump * 0.5, 6, 30);
    }
  }
  // 彩纸
  for (let i = 0; i < 40; i++) {
    const x = (i * 83) % L.W;
    const y = ((t - 0.4) * (140 + (i % 5) * 40) + ((i * 47) % 200) - 200);
    if (t < 0.4 || y > L.H) continue;
    ctx.fillStyle = ['#ffd23f', '#e3263b', '#3ef0ff', '#f4f1de'][i % 4];
    ctx.save();
    ctx.translate(x + Math.sin(t * 4 + i) * 10, y);
    ctx.rotate(t * 5 + i);
    ctx.fillRect(-4, -2, 8, 4);
    ctx.restore();
  }
  ctx.save();
  ctx.translate(L.W / 2, L.H * 0.47);
  ctx.rotate(-0.05);
  const k = pop((t - 0.8) / 0.4);
  ctx.scale(k, k);
  comicText(ctx, '第 ' + matchNo + ' 场 拿下！', 0, 0, 36);
  ctx.restore();
}

// —— 女队友把你拉起来（约 3.4 秒，第一人称）——
// drawWorld(ctx)：画你倒下时看到的狙击镜画面（由 main.js 传进来）
const RESCUE_SEC = 3.4;
const HER = { hair: '#1f6f78', jacket: '#2e86ab', skin: '#f1c6a8', style: 'ponytail' };
function rescue(ctx, L, t, th) {
  // 倒在地上往上看：天是斜的；被拉起来时转正
  const pull = ease((t - 1.35) / 0.7);
  const tilt = lerp(-0.42, 0, pull);
  const rise = lerp(L.H * 0.25, 0, pull);
  const shake = t > 1.2 && t < 1.45 ? Math.sin(t * 90) * 6 : 0;
  ctx.save();
  ctx.translate(L.W / 2 + shake, L.H / 2 + rise);
  ctx.rotate(tilt);
  ctx.translate(-L.W / 2, -L.H / 2);
  sky(ctx, L, th.sky, -L.H * 0.4, L.H * 1.4, -L.W * 0.6);
  // 屋顶边和远处的楼
  ctx.fillStyle = th.far.color;
  for (let i = 0; i < 8; i++) ctx.fillRect(-100 + i * 80, L.H * 0.5 - ((i * 53) % 90), 60, L.H);
  ctx.fillStyle = th.pal[0][1];
  ctx.fillRect(-200, L.H * 0.72, L.W * 2, L.H);
  ink(ctx, 4);
  ctx.strokeRect(-200, L.H * 0.72, L.W * 2, L.H);

  // 她：从右上探进来，弯腰往下看你（人在转的画面里，跟着天一起转正）
  const inK = ease((t - 0.25) / 0.6);
  const herX = lerp(L.W + 160, L.W * 0.68, inK);
  const herY = L.H * 0.3 + 235 + pull * 40; // 脚底；头大约在 L.H*0.3
  ctx.save();
  ctx.translate(herX, herY);
  ctx.rotate(-0.28 * (1 - pull) - 0.08);
  person(ctx, 0, 0, 2.1, HER, { headset: true, smile: t > 2.0, team: '#ffd23f' });
  ctx.restore();
  ctx.restore();

  // 她伸过来的手：从她肩膀伸到画面中下，越伸越近（越来越大）
  const reach = ease((t - 0.6) / 0.6);
  const handS = lerp(0.5, 1.15, reach) * (1 - pull * 0.2);
  const handX = lerp(L.W * 0.72, L.W * 0.46, reach);
  const handY = lerp(L.H * 0.42, L.H * 0.62, reach) - pull * 60;
  const shX = herX - 40;
  const shY = L.H * 0.3 + 110 + rise * 0.5;
  if (t > 0.55) {
    ctx.lineCap = 'round';
    ctx.strokeStyle = INK;
    ctx.lineWidth = 34 * handS + 8;
    ctx.beginPath();
    ctx.moveTo(shX, shY);
    ctx.lineTo(handX + 10, handY - 6);
    ctx.stroke();
    ctx.strokeStyle = HER.jacket;
    ctx.lineWidth = 34 * handS;
    ctx.stroke();
    ctx.save();
    ctx.translate(handX, handY);
    ctx.scale(handS, handS);
    ctx.fillStyle = HER.skin;
    ink(ctx, 4);
    ctx.beginPath();
    ctx.arc(10, -4, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    const grip = t > 1.2 ? 1 : 0;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(-16 + grip * 12, -26 + i * 14, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }
  // 你的手（从下面伸上去握住）
  if (t > 1.0) {
    const k = ease((t - 1.0) / 0.25);
    ctx.save();
    ctx.translate(handX - 30, lerp(L.H + 60, handY + 34, k));
    ctx.rotate(0.15);
    ctx.fillStyle = ME.jacket;
    ctx.fillRect(-26, 0, 52, 200);
    ink(ctx, 4);
    ctx.strokeRect(-26, 0, 52, 200);
    ctx.fillStyle = ME.skin;
    ctx.beginPath();
    ctx.arc(0, -6, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  if (t > 1.2 && t < 1.7) {
    const k = ease((t - 1.2) / 0.12);
    starburst(ctx, handX, handY, 60 * k, 36 * k, 10, '#ffd23f');
    comicText(ctx, '啪！', handX, handY, 30 * k);
  }

  // 刚倒下：一圈暗、心跳一缩一缩
  const dark = 1 - ease(t / 1.6);
  if (dark > 0) {
    const beat = 0.5 + 0.5 * Math.sin(t * 9);
    const vg = ctx.createRadialGradient(L.W / 2, L.H / 2, L.W * (0.2 + beat * 0.05), L.W / 2, L.H / 2, L.H * 0.7);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(60,0,10,' + (0.9 * dark).toFixed(2) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, L.W, L.H);
    ctx.fillStyle = 'rgba(80,80,90,' + (0.45 * dark).toFixed(2) + ')';
    ctx.fillRect(0, 0, L.W, L.H);
  }

  // 她说话
  if (t > 1.7) {
    const k = pop((t - 1.7) / 0.3);
    ctx.save();
    ctx.translate(L.W * 0.36, L.H * 0.12);
    ctx.scale(k, k);
    roundRect(ctx, -110, -28, 220, 56, 18);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ink(ctx, 3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(50, 26);
    ctx.lineTo(80, 52);
    ctx.lineTo(70, 24);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = INK;
    ctx.font = '900 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('起来，还没完！', 0, 1);
    ctx.restore();
  }
}

// —— 第一次拿下网吧赛：从网吧椅子上站起来，原来身边坐的都是队友 ——
// 背面（0~3.4 秒）→ 唰 → 正面（队友一个个站起来）→ 横幅
const REVEAL_SEC = 8.5;
function revealScene(ctx, L, t, mates, opts) {
  opts = opts || {};
  const front = t > 3.4;
  ctx.fillStyle = '#1a1030';
  ctx.fillRect(0, 0, L.W, L.H);
  // 墙上的霓虹招牌
  const flick = Math.sin(t * 23) > -0.8 ? 1 : 0.3;
  ctx.save();
  ctx.globalAlpha = flick;
  roundRect(ctx, L.W / 2 - 90, 40, 180, 50, 10);
  ctx.strokeStyle = '#ff4fd8';
  ctx.lineWidth = 4;
  ctx.stroke();
  comicText(ctx, '星光网吧', L.W / 2, 66, 26, '#ffd9f4', '#ff4fd8');
  ctx.restore();

  if (!front) {
    // 背后看：一排电脑，你在中间。前景是网吧里别的客人（黑影）
    const deskY = L.H * 0.5;
    const n = 6;
    const meIdx = 2;
    // 天花板的灯管和墙上的海报
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = 'rgba(200,230,255,0.75)';
      ctx.fillRect(30 + i * ((L.W - 120) / 2), 120, 60, 6);
    }
    [[24, 150, '#e3263b'], [L.W - 84, 160, '#3ef0ff']].forEach(([x, y, c]) => {
      ctx.fillStyle = c;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(x, y, 60, 80);
      ctx.globalAlpha = 1;
      ink(ctx, 2);
      ctx.strokeRect(x, y, 60, 80);
    });
    for (let i = 0; i < n; i++) {
      const x = ((i + 0.5) / n) * L.W;
      ctx.fillStyle = i === meIdx ? '#ffe9a8' : 'rgba(90,200,255,0.6)';
      ctx.fillRect(x - 28, deskY - 110, 56, 44);
      ink(ctx, 2.5);
      ctx.strokeRect(x - 28, deskY - 110, 56, 44);
      if (i === meIdx && t < 1.4) comicText(ctx, '嘣', x, deskY - 88, 18);
    }
    ctx.fillStyle = '#3a2a4a';
    ctx.fillRect(0, deskY - 64, L.W, 16);
    for (let i = 0; i < n; i++) {
      const x = ((i + 0.5) / n) * L.W;
      if (i === meIdx) continue;
      // 旁边的人：帽衫兜帽戴着，看不出是谁
      const m = mates[i < meIdx ? i : i - 1];
      person(ctx, x, deskY + 22, 0.85, { hair: '#2b2438', jacket: '#2b2438', skin: m.look.skin, style: 'short' }, { pose: 'sit', back: true });
    }
    // 你：慢慢站起来，摘耳机
    const mx = ((meIdx + 0.5) / n) * L.W;
    const up = ease((t - 1.3) / 0.8);
    person(ctx, mx, deskY + 22 + up * 40, 0.85 + up * 0.25, ME, { pose: up > 0.5 ? 'stand' : 'sit', back: true, headset: t < 2.3 });
    if (t > 2.3) {
      const hk = ease((t - 2.3) / 0.4);
      ctx.save();
      ctx.translate(mx + 50 * hk, deskY - 60 - 60 * hk);
      ink(ctx, 5);
      ctx.beginPath();
      ctx.arc(0, 0, 16, Math.PI, 0);
      ctx.stroke();
      ctx.fillStyle = '#2b2438';
      ctx.fillRect(-20, -2, 8, 14);
      ctx.fillRect(12, -2, 8, 14);
      ctx.restore();
    }
    // 前景：网吧里别的客人，转过头来，头上冒「！」
    for (let i = 0; i < 5; i++) {
      const x = 20 + i * ((L.W - 40) / 4);
      const y = L.H - 70 + (i % 2) * 24;
      ctx.fillStyle = '#0a0612';
      ctx.beginPath();
      ctx.arc(x, y, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(x - 50, y + 26, 100, 120);
      if (t > 2.0) {
        const k = pop((t - 2.0 - i * 0.12) / 0.3);
        comicText(ctx, '！', x, y - 62, 40 * k);
      }
    }
    if (t > 3.1) {
      // 唰：白光扫过
      const k = ease((t - 3.1) / 0.3);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.9 * k).toFixed(2) + ')';
      ctx.fillRect(0, 0, L.W, L.H);
    }

const panelR = { x: L.W / 2 - 150, y: scopeC.y + D / 2 + 12, w: 300, h: Math.min(84, Math.max(60, L.H - scopeC.y - D / 2 - 160)) };
const btnY = Math.max(panelR.y + panelR.h + 56, Math.min(L.H - 70, scopeC.y + D / 2 + (L.H - scopeC.y - D / 2) / 2 + 30));
const eyeBtn = { x: L.W * 0.24, y: btnY, r: 38 };
const trigBtn = { x: L.W * 0.73, y: btnY, r: 50 };
const LV = require('./levels.js');
// 0.8 全景：整张场景缩小放在镜子的位置，点一下 = 放大到那里
const WIDE = { x: 0, w: L.W, h: (L.W * 600) / 860 };
WIDE.y = scopeC.y - WIDE.h / 2;
const zoomBtn = { x: scopeC.x + D / 2 - 26, y: scopeC.y + D / 2 - 18, r: 24 };
// 二战样机：小队按钮，放在缩头和扳机中间，上下两个
const SQ_X = (eyeBtn.x + eyeBtn.r + trigBtn.x - trigBtn.r) / 2;
const squadBtns = [{ x: SQ_X, y: btnY - 30, r: 24 }, { x: SQ_X, y: btnY + 30, r: 24 }];
const TRIGGER_FINE = 0.4; // 按着扳机滑动时，手指走 1 点、准星走 0.4 点

const G = {
  mode: 'title',
  modeT: 0,
  t: 0,
  level: null, // 正在打的关（levels.js）
  roundIdx: 0,
  attempt: 0,
  duel: null,
  results: [],
  card: null, // 关前带的临场卡
  pickCard: null, // 带卡页上选中的
  mods: null,
  rescuesLeft: config.rescuesPerLevel,
  ammoAdsLeft: config.ammoAdsPerLevel,
  stats: null, // 这一关：浪费几发、被瞄准过没有、拉人几次、用时
  adFor: 'rescue', // 广告是为了：rescue 拉人 / ammo 扔子弹
  failReason: '',
  resultInfo: null,
  buttons: [],
  missFlash: 0,
  shake: 0,
  slow: 0, // 慢动作还剩几秒（擦身而过）
  bossHitT: -1,
  toast: null,
  say: null,
  say2: null,
  sfxT: {}, // 每种连续音效上一次响的时间
  metrics: { roundSec: [], retrySec: [] }, // 量一局几秒、死到重开几秒
  failAt: 0,
  near: '',
  seedBase: Math.floor(Math.random() * 100000),
  title: null, // 开场背景
};

const FAIL_TEXT = { dead: '他先开枪了', timeout: '时间到了', dry: '子弹打光了', mateDown: '小雨被打中了', escaped: '目标跑了', boom: '炸弹炸了', spotted: '被巡逻发现了' };

function setMode(m) {
  G.mode = m;
  G.modeT = 0;
}

function toast(text) {
  G.toast = { text, t: 0 };
}

function sfx(name, vol) {
  platform.sound(name, vol);
}

// 一种连续的声音（滴滴、心跳）：隔 gap 秒才响一次
function sfxEvery(name, gap, vol) {
  const last = G.sfxT[name] || -99;
  if (G.t - last >= gap) {
    G.sfxT[name] = G.t;
    sfx(name, vol);
  }
}

function levelUnlocked(lv) {
  const S = team.state();
  if (lv.legacy || lv.index === 0) return true;
  const prev = (lv.city ? LV.CITY_LEVELS : lv.ww2 ? LV.WW2_LEVELS : LV.LEVELS)[lv.index - 1];
  if (S.cleared.indexOf(prev.id) < 0) return false;
  if (lv.needStars && team.totalStars() < lv.needStars) return false;
  return true;
}

function startRound() {
  const R = G.level.rounds[G.roundIdx];
  G.zoom = false; // 目标关先看全景
  if (R.mission) {
    G.duel = createMission({ seed: G.seedBase + G.roundIdx * 37 + G.attempt * 7919, config, scopeD: D, round: R, levelIndex: G.level.index, mods: G.mods });
    return;
  }
  G.duel = createDuel({
    seed: G.seedBase + G.roundIdx * 37 + (G.daily ? 0 : G.attempt * 7919), // 每日挑战重来还是同一局
    config,
    scopeD: D,
    round: G.level.rounds[G.roundIdx],
    levelIndex: G.level.index,
    mods: G.mods,
    alternate: G.level.ww2 ? !!G.alternate : false,
  });
}

function openLevel(lv) {
  if (!levelUnlocked(lv)) {
    toast(lv.needStars && team.totalStars() < lv.needStars ? '要攒够 ' + lv.needStars + ' 颗星' : '先过前一关');
    return;
  }
  if (lv.standoff) {
    openStandoff(lv);
    return;
  }
  G.level = lv;
  if (lv.city || lv.ww2) {
    // 第一座城 / 二战样机：不带卡，直接开打
    G.pickCard = null;
    startLevel();
    return;
  }
  const cards = team.unlockedCards();
  if (!G.pickCard || !cards.some((c) => c.id === G.pickCard)) G.pickCard = cards.length ? cards[0].id : null;
  setMode('loadout');
}

function startLevel() {
  G.arena = null;
  G.daily = null;
  G.card = G.level.city || G.level.ww2 ? null : G.pickCard;
  G.mods = G.level.city ? team.gunMods() : G.level.ww2 ? team.mods([]) : team.mods(G.card ? [G.card] : []);
  G.rescuesLeft = config.rescuesPerLevel + G.mods.rescueAdd;
  G.ammoAdsLeft = config.ammoAdsPerLevel;
  G.seedBase = Math.floor(Math.random() * 100000); // 以后每日挑战改成固定 seed
  G.roundIdx = 0;
  G.attempt = 0;
  G.results = [];
  G.stats = { wasted: 0, locked: false, rescued: 0, sec: 0, heads: 0, wrong: 0 };
  startRound();
  const S = team.state();
  const mission = !!G.level.rounds[0].mission;
  if (G.level.boss && S.cleared.indexOf(G.level.id) < 0) setMode('bossIntro');
  else if (G.level.teach && !team.taught(G.level.id)) setMode('teach');
  else setMode(mission ? 'brief' : 'intro');
}

// 输了点一下：直接回到这个回合开打（不放说明页、不放回合卡）
function retryRound() {
  if (G.duel) addStats(G.duel);
  G.metrics.retrySec.push(+(G.t - G.failAt).toFixed(2));
  G.attempt += 1;
  startRound();
  setMode('play');
}

function goMap() {
  G.arena = null;
  G.daily = null;
  setMode('map');
}

// —— 擂台：一个接一个打，每赢一个叠一个加难，记最高连胜 ——
function startArena() {
  G.arena = { streak: 0, mods: [], rand: rng(Math.floor(Math.random() * 1e9)), newMod: null };
  G.daily = null;
  G.card = null;
  G.mods = team.mods([]);
  G.rescuesLeft = config.rescuesPerLevel + G.mods.rescueAdd;
  G.ammoAdsLeft = config.ammoAdsPerLevel;
  G.stats = { wasted: 0, locked: false, rescued: 0, sec: 0 };
  nextArenaRound();
}

function nextArenaRound() {
  const A = G.arena;
  G.level = { id: 'arena', name: '擂台', no: 0, index: 8, stars: [], rounds: [LV.arenaRound(A.mods, A.rand)] };
  G.roundIdx = 0;
  G.attempt = 0;
  G.seedBase = Math.floor(A.rand() * 1e6);
  startRound();
  setMode('intro');
}

function arenaWin() {
  const A = G.arena;
  A.streak += 1;
  team.earn('perRound');
  const m = LV.pickArenaMod(A.mods, A.rand);
  A.newMod = m;
  if (m) A.mods.push(m.id);
  A.best = team.recordArena(A.streak);
  sfx('star');
  setMode('arenaNext');
}

function endArena() {
  if (G.arena) team.recordArena(G.arena.streak);
  G.arena = null;
  goTitle();
}

// —— 每日挑战：今天所有人同一局，三个回合，比用时 ——
function dayKey() {
  const n = new Date();
  return n.getFullYear() * 10000 + (n.getMonth() + 1) * 100 + n.getDate();
}

function startDaily() {
  const day = dayKey();
  G.arena = null;
  G.daily = { day, sec: 0 };
  G.card = null;
  G.mods = team.mods([]);
  G.rescuesLeft = 0; // 每日挑战比真本事：不拉人
  G.ammoAdsLeft = 0;
  G.stats = { wasted: 0, locked: false, rescued: 0, sec: 0 };
  G.level = { id: 'daily', name: '每日挑战', no: 0, index: 8, stars: [], rounds: LV.dailyRounds(day, rng) };
  G.roundIdx = 0;
  G.attempt = 0;
  G.seedBase = day;
  startRound();
  setMode('intro');
}

function finishDaily() {
  const sec = G.stats.sec;
  G.daily.sec = sec;
  G.daily.best = team.recordDaily(G.daily.day, sec);
  team.earn('perRound', 3);
  sfx('win');
  setMode('dailyDone');
}

function startClassic() {
  G.classic = classic.createClassic(Math.floor(Math.random() * 99999), D, config);
  setMode('classic');
}

function goTitle() {
  const id = 'ruins'; // 二战样机：开场就是废墟城镇
  G.title = { sc: scene.build(Math.floor(Math.random() * 99999), { poseShift: 3, contrast: 0.2 }, D, id) };
  setMode('title');
}

// —— 0.10 精简版对决：望远镜找 → 点一下开镜 → 等他探头 → 一枪（局里不写字） ——
function startStandoff(lv) {
  G.arena = null;
  G.daily = null;
  G.level = lv;
  G.so = createStandoff({ seed: Math.floor(Math.random() * 1e9), config, scopeD: D, level: lv.level });
  G.soHint = !team.taught(lv.id) && lv.index === 0;
  setMode('so');
}
function openStandoff(lv) {
  G.level = lv;
  if (lv.index === 0 && !team.taught('soTeach')) setMode('soTeach');
  else startStandoff(lv);
}
function finishStandoff() {
  const d = G.so;
  const r = d.result();
  G.stats = { wasted: r.misses, locked: r.maxNotice >= 0.5, rescued: 0, sec: r.sec, heads: 0, wrong: 0, misses: r.misses, maxNotice: r.maxNotice };
  team.markTaught(G.level.id);
  finishLevel();
}
function updateStandoff(dt) {
  const d = G.so;
  d.update(dt);
  while (d.events.length) {
    const ev = d.events.shift();
    if (ev.kind === 'scopeIn') sfx('duck', 0.25);
    else if (ev.kind === 'scopeOut') sfx('crawl', 0.3);
    else if (ev.kind === 'shot') { sfx('shot'); platform.vibrate(true); if (ev.result !== 'hit') G.shake = 0.25; }
    else if (ev.kind === 'enemyShot') { sfx('enemyShot'); platform.vibrate(true); }
  }
  if (d.state === 'play' && !d.wide) {
    if (d.notice > 0.35) sfxEvery('heart', 0.95 / d.heart, 0.5);
    const g = d.glint();
    if (g > 0.6 && !G.soGlintHi) sfx('glint', 0.4);
    G.soGlintHi = g > 0.6;
  }
  if (d.state === 'hit') { sfx('boom'); G.failAt = G.t; setMode('soHit'); }
  else if (d.state === 'dead' || d.state === 'dry') { G.failAt = G.t; G.failReason = d.state; sfx('lose'); setMode('soFail'); }
}

// 镜子里的世界：望远镜（两个圆、缩小）或狙击镜（一个圆）
function drawSoView(ctx, d, opt) {
  const cx = scopeC.x;
  const cy = scopeC.y;
  const z = d.wide ? d.ZOOM_WIDE : 1;
  const cam = opt.cam || d.cam;
  ctx.save();
  ctx.beginPath();
  if (d.wide) {
    ctx.arc(cx - D * 0.22, cy, D * 0.4, 0, Math.PI * 2);
    ctx.moveTo(cx + D * 0.22 + D * 0.4, cy);
    ctx.arc(cx + D * 0.22, cy, D * 0.4, 0, Math.PI * 2);
  } else ctx.arc(cx, cy, D / 2, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(cx, cy);
  ctx.scale(z, z);
  ctx.translate(-cx, -cy);
  scene.draw(ctx, d.sc, cam, cx, cy, d.view(), { t: G.t, fog: 0 });
  const ox = cx - cam.x;
  const oy = cy - cam.y;
  // 他探头前的小动静
  const tl = d.tellAt;
  if (tl && (d.mode === 'tell' || d.mode === 'rise')) {
    const k = clamp((d.t - tl.t) / config.standoff.tellSec, 0, 1);
    const x = ox + tl.x;
    const y = oy + tl.y;
    if (tl.kind === 'curtain') {
      ctx.fillStyle = '#efe2c0';
      ctx.fillRect(x - 9 + Math.sin(d.t * 9) * 4, y - 6, 9, 20);
    } else if (tl.kind === 'ember') {
      if (Math.sin(d.t * 7) > -0.2) {
        ctx.fillStyle = 'rgba(255,150,50,0.3)';
        ctx.beginPath();
        ctx.arc(x + 6, y + 4, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff9a2e';
        ctx.beginPath();
        ctx.arc(x + 6, y + 4, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = 'rgba(220,210,190,0.9)';
      for (let i = 0; i < 7; i++) ctx.fillRect(x - 8 + i * 2.6, y + 22 + ((k * 40 + i * 7) % 30), 2, 2);
    }
  }
  // 他的镜片：越亮越危险
  const g = opt.glint === undefined ? d.glint() : opt.glint;
  if (g > 0 && d.enemyUp()) {
    const h = d.head();
    const gx = ox + h.x - 2;
    const gy = oy + h.y + 1;
    const rr = (3 + 10 * g) / z;
    const on = g < 0.7 || Math.sin(G.t * 22) > -0.4;
    if (on) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.65 * g).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(gx, gy, (1.5 + 2 * g) / z, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 + 0.7 * g).toFixed(2) + ')';
      ctx.lineWidth = 1.5 / z;
      ctx.beginPath();
      ctx.moveTo(gx - rr, gy);
      ctx.lineTo(gx + rr, gy);
      ctx.moveTo(gx, gy - rr);
      ctx.lineTo(gx, gy + rr);
      ctx.stroke();
    }
  }
  ctx.restore();
  if (d.wide) {
    ctx.strokeStyle = '#2b2438';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(cx - D * 0.22, cy, D * 0.4 + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + D * 0.22, cy, D * 0.4 + 3, 0, Math.PI * 2);
    ctx.stroke();
  } else {
    // 他越清楚你在哪，镜子边上越红
    if (d.notice > 0.05 && d.state === 'play') {
      const rg = ctx.createRadialGradient(cx, cy, D * 0.35, cx, cy, D / 2);
      rg.addColorStop(0, 'rgba(255,0,40,0)');
      rg.addColorStop(1, 'rgba(255,0,40,' + (d.notice * 0.55).toFixed(2) + ')');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(cx, cy, D / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    if (!opt.noCross) drawCrosshair(ctx, cx + d.sway.x, cy + d.sway.y, d.steadiness());
    if (d.flash > 0) {
      ctx.fillStyle = 'rgba(255,220,120,' + (d.flash * 2).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(cx, cy, D / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    scopeRing(ctx, cx, cy, D);
  }
}

function drawBinoIcon(ctx, x, y) {
  ctx.strokeStyle = '#f4f1de';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x - 9, y + 2, 8, 0, Math.PI * 2);
  ctx.moveTo(x + 17, y + 2);
  ctx.arc(x + 9, y + 2, 8, 0, Math.PI * 2);
  ctx.moveTo(x - 4, y - 6);
  ctx.lineTo(x + 4, y - 6);
  ctx.stroke();
}

function drawStandoff() {
  const ctx = P.ctx;
  const d = G.so;
  const m = G.mode;
  ctx.fillStyle = '#120c1c';
  ctx.fillRect(0, 0, L.W, L.H);
  if (m === 'soFail') {
    // 输了：镜子对准他，红圈指出他在哪
    const h = d.head(1);
    const cam = { x: clamp(h.x, D / 2, d.sc.w - D / 2), y: clamp(h.y, D / 2, d.sc.h - D / 2) };
    const wasWide = d.wide;
    d.wide = false;
    d.sc.enemy.lift = 1;
    drawSoView(ctx, d, { cam, noCross: true, glint: 1 });
    d.wide = wasWide;
    ctx.strokeStyle = '#ff4d5e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(scopeC.x + h.x - cam.x, scopeC.y + h.y - cam.y + 4, 22 + Math.sin(G.modeT * 6) * 3, 0, Math.PI * 2);
    ctx.stroke();
    comicText(ctx, G.failReason === 'dry' ? '子弹打光了' : '他先开枪了', L.W / 2, 40, 30, '#ff4d5e');
    comicText(ctx, G.failReason === 'dry' ? '他探头才打得着' : '镜片发白，就该收镜', L.W / 2, scopeC.y + D / 2 + 34, 17, '#ffd23f');
    const by = L.H - 150;
    button('soRetry', '再来', L.W / 2 - 75, by, 150, 54, () => startStandoff(G.level), true);
    button('soMap', '回地图', L.W / 2 - 60, by + 70, 120, 42, goMap);
    return;
  }
  drawSoView(ctx, d, {});
  // 左上：子弹
  for (let i = 0; i < d.bulletsMax; i++) drawBullet(ctx, 18 + i * 14, 40, i < d.bullets);
  text(G.level.no + ' · ' + G.level.name, 14, 18, 12, 'rgba(244,241,222,0.6)', 'left', 800);
  if (m === 'soHit') {
    const k = clamp(G.modeT / 0.3, 0, 1);
    if (G.modeT < 0.15) {
      ctx.fillStyle = 'rgba(255,250,220,0.6)';
      ctx.fillRect(0, 0, L.W, L.H);
    }
    starburst(ctx, scopeC.x + 60, scopeC.y - 70, 60 * k, 36 * k, 12, '#ffd23f');
    comicText(ctx, '砰！', scopeC.x + 60, scopeC.y - 70, 36 * k);
    return;
  }
  // 左下：收镜（开着狙击镜时才有）
  if (!d.wide) {
    ctx.beginPath();
    ctx.arc(eyeBtn.x, eyeBtn.y, eyeBtn.r, 0, Math.PI * 2);
    ctx.fillStyle = '#3a3150';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    drawBinoIcon(ctx, eyeBtn.x, eyeBtn.y);
    // 他快发现你了：收镜按钮跳
    if (d.notice > 0.55) pulse(ctx, eyeBtn);
  }
  // 右下：扳机（望远镜里是灰的）
  const st = d.steadiness();
  ctx.beginPath();
  ctx.arc(trigBtn.x, trigBtn.y, trigBtn.r, 0, Math.PI * 2);
  ctx.fillStyle = d.wide ? '#241d33' : st === 'steady' ? '#c2263a' : st === 'tremble' ? '#d9730d' : st === 'settling' ? '#7a2d45' : '#3a3150';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.globalAlpha = d.wide ? 0.3 : 1;
  drawCrossIcon(ctx, trigBtn.x, trigBtn.y, 20);
  ctx.globalAlpha = 1;
  // 第一关的手势提示（不写字）：望远镜里点一下；他探头时按扳机
  if (G.soHint && d.state === 'play') {
    if (d.wide) {
      const k = (G.t * 1.2) % 1;
      ctx.fillStyle = 'rgba(255,210,63,' + (1 - k).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(scopeC.x, scopeC.y, 10 + k * 26, 0, Math.PI * 2);
      ctx.fill();
    } else if (d.enemyUp() && d.shots === 0) pulse(ctx, trigBtn);
  }
}

// 第一次进来：三格图讲完怎么玩（每格四个字以内）
function drawSoTeach() {
  const ctx = P.ctx;
  ctx.fillStyle = '#120c1c';
  ctx.fillRect(0, 0, L.W, L.H);
  comicText(ctx, '狙击手对决', L.W / 2, 70, 30);
  const cells = [
    { cap: '点一下看', draw: (x, y) => { drawBinoIcon(ctx, x, y); ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x + 26, y + 22, 6, 0, Math.PI * 2); ctx.fill(); } },
    { cap: '亮了就收', draw: (x, y) => { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - 20, y); ctx.lineTo(x + 20, y); ctx.moveTo(x, y - 20); ctx.lineTo(x, y + 20); ctx.stroke(); ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); } },
    { cap: '探头就打', draw: (x, y) => { ctx.fillStyle = '#6a5a78'; ctx.beginPath(); ctx.arc(x, y - 6, 9, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(x - 13, y + 4, 26, 14); ctx.strokeStyle = '#e3263b'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y - 6, 14, 0, Math.PI * 2); ctx.moveTo(x - 22, y - 6); ctx.lineTo(x + 22, y - 6); ctx.moveTo(x, y - 28); ctx.lineTo(x, y + 16); ctx.stroke(); } },
  ];
  cells.forEach((c, i) => {
    const k = clamp((G.modeT - 0.2 - i * 0.3) / 0.3, 0, 1);
    if (k <= 0) return;
    const y = 150 + i * 150;
    ctx.save();
    ctx.globalAlpha = k;
    roundRect(ctx, L.W / 2 - 120, y - 50, 240, 120, 12);
    ctx.fillStyle = '#2b2438';
    ctx.fill();
    c.draw(L.W / 2, y);
    comicText(ctx, c.cap, L.W / 2, y + 50, 20, '#ffd23f');
    ctx.restore();
  });
  if (G.modeT > 1.2) text('点一下开始', L.W / 2, L.H - 60, 13, 'rgba(244,241,222,0.75)', 'center', 700);
}

// —— 输入 ——
function inCircle(b, x, y) {
  return Math.hypot(x - b.x, y - b.y) <= b.r + 8;
}

const TAP_TO_SKIP = { soTeach: 1.0, soHit: 0.8, arenaNext: 0.5, bossIntro: 0.5, teach: 0.6, intro: 0.3, brief: 0.5, reveal: 1.0, move: 0.6, hit: 0.5, ammoGift: 0.4 };

// 下面那栋楼的小图上点了哪扇窗
function panelCell(x, y) {
  const p = panelR;
  const d = G.duel;
  if (x < p.x || x > p.x + p.w || y < p.y || y > p.y + p.h) return null;
  const cw = (p.w - 20) / d.COLS;
  const ch = (p.h - 22) / d.ROWS;
  const c = Math.floor((x - p.x - 10) / cw);
  const r = Math.floor((y - p.y - 16) / ch);
  if (c < 0 || c >= d.COLS || r < 0 || r >= d.ROWS) return null;
  return { c, r };
}

function onTouch(type, id, sx, sy) {
  const x = sx / scale;
  const y = sy / scale;
  if (type === 'down') {
    const hitBtn = G.buttons.find((b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (hitBtn) {
      touches[id] = { role: 'ui' };
      hitBtn.fn();
      return;
    }
    if (G.mode === 'so') {
      const d = G.so;
      if (!d.wide && inCircle(eyeBtn, x, y)) { d.scopeOut(); touches[id] = { role: 'ui' }; return; }
      if (!d.wide && inCircle(trigBtn, x, y)) { d.triggerDown(); touches[id] = { role: 'sotrig', x, y }; return; }
      if (d.wide && inCircle(trigBtn, x, y)) { touches[id] = { role: 'ui' }; return; }
      if (Math.abs(y - scopeC.y) < D / 2 + 30) touches[id] = { role: 'sopan', x, y, sx: x, sy: y };
      return;
    }
    const skip = TAP_TO_SKIP[G.mode];
    if (skip !== undefined) {
      if (G.modeT > skip) skipAhead();
      touches[id] = { role: 'ui' };
      return;
    }
    if (G.mode === 'classic') {
      const c = G.classic;
      if (c.state !== 'play') return;
      if (inCircle(eyeBtn, x, y)) { c.toggle(); touches[id] = { role: 'ui' }; }
      else if (inCircle(trigBtn, x, y)) { c.fire(); sfx(c.wide ? 'wrong' : 'shot'); platform.vibrate(true); touches[id] = { role: 'ui' }; }
      else if (Math.hypot(x - scopeC.x, y - scopeC.y) < D / 2 + 30) touches[id] = { role: 'cpan', x, y };
      return;
    }
    if (G.mode !== 'play') return;
    if (G.duel.kind === 'mission') {
      const d = G.duel;
      // 全景：点一下 = 放大到那里
      if (!G.zoom) {
        if (y >= WIDE.y && y <= WIDE.y + WIDE.h) {
          const k = 860 / WIDE.w;
          d.cam.x = (x - WIDE.x) * k;
          d.cam.y = (y - WIDE.y) * k;
          d.pan(0, 0);
          G.zoom = true;
          sfx('duck', 0.3);
          touches[id] = { role: 'ui' };
        } else if (inCircle(trigBtn, x, y)) toast('先点全景里的一处，放大再开枪');
        return;
      }
      if (inCircle(zoomBtn, x, y)) {
        G.zoom = false;
        d.holding = false;
        touches[id] = { role: 'ui' };
        return;
      }
      if (d.canDuck && inCircle(eyeBtn, x, y)) {
        touches[id] = { role: 'duck' };
        d.duckDown();
      } else if (inCircle(trigBtn, x, y)) {
        touches[id] = { role: 'trigger', x, y };
        d.triggerDown();
      } else if (Math.hypot(x - scopeC.x, y - scopeC.y) < D / 2 + 30) touches[id] = { role: 'pan', x, y };
      return;
    }
    const sqHit = (G.duel.squad || []).findIndex((m, i) => squadBtns[i] && inCircle(squadBtns[i], x, y));
    if (sqHit >= 0) {
      touches[id] = { role: 'ui' };
      const m = G.duel.squad[sqHit];
      if (!G.duel.useSquad(m.id)) toast(m.charges <= 0 ? '这一局用完了' : m.id === 'beret' ? '楼下现在没有巡逻' : '钢盔已经举着了');
      return;
    }
    const cell = panelCell(x, y);
    if (cell) {
      touches[id] = { role: 'ui' };
      if (!G.duel.moveWindow(cell.c, cell.r) && G.duel.moving <= 0 && cell.c === G.duel.me.c && cell.r === G.duel.me.r) toast('点别的窗 = 爬过去');
      return;
    }
    if (inCircle(eyeBtn, x, y)) {
      touches[id] = { role: 'duck' };
      G.duel.duckDown();
    } else if (inCircle(trigBtn, x, y)) {
      touches[id] = { role: 'trigger', x, y };
      G.duel.triggerDown();
    } else if (Math.hypot(x - scopeC.x, y - scopeC.y) < D / 2 + 30) {
      touches[id] = { role: 'pan', x, y };
    }
  } else if (type === 'move') {
    const t = touches[id];
    if (t && t.role === 'cpan' && G.mode === 'classic') {
      G.classic.pan(x - t.x, y - t.y);
      t.x = x;
      t.y = y;
    }
    if (t && t.role === 'pan' && G.mode === 'play') {
      G.duel.pan(x - t.x, y - t.y);
      t.x = x;
      t.y = y;
    }
    if (t && t.role === 'sopan' && G.mode === 'so') {
      if (Math.hypot(x - t.sx, y - t.sy) > 8) t.moved = true;
      if (t.moved) G.so.pan(x - t.x, y - t.y);
      t.x = x;
      t.y = y;
    }
    if (t && t.role === 'sotrig' && G.mode === 'so' && G.so.holding) {
      G.so.pan(-(x - t.x) * TRIGGER_FINE, -(y - t.y) * TRIGGER_FINE);
      t.x = x;
      t.y = y;
    }
    // 按着扳机滑动 = 微调准星（一根手指：按住稳住、滑一点对准、松手开枪）。手指往哪滑，准星往哪走，走得比拖镜子慢
    if (t && t.role === 'trigger' && G.mode === 'play' && G.duel.holding) {
      G.duel.pan(-(x - t.x) * TRIGGER_FINE, -(y - t.y) * TRIGGER_FINE);
      t.x = x;
      t.y = y;
    }
  } else {
    const t = touches[id];
    delete touches[id];
    if (t && t.role === 'duck' && G.duel) G.duel.duckUp();
    if (t && t.role === 'sopan' && G.mode === 'so' && !t.moved && G.so.wide) G.so.zoomAt(t.sx - scopeC.x, t.sy - scopeC.y);
    if (t && t.role === 'sotrig' && G.mode === 'so') G.so.triggerUp();
    if (t && t.role === 'trigger' && G.mode === 'play') {
      const res = G.duel.triggerUp();
      if (res) {
        platform.vibrate(true);
        G.lastShot = res;
        if (!res.hit) G.missFlash = 1.0;
      }
    }
  }
}

// 点一下跳过过场
function skipAhead() {
  const m = G.mode;
  if (m === 'soTeach') { team.markTaught('soTeach'); startStandoff(G.level); return; }
  if (m === 'soHit') { finishStandoff(); return; }
  if (m === 'bossIntro') setMode('teach');
  else if (m === 'teach') { team.markTaught(G.level.id); setMode(G.duel.kind === 'mission' ? 'brief' : 'intro'); }
  else if (m === 'intro' || m === 'brief') setMode('play');
  else if (m === 'move') setMode('intro');
  else if (m === 'hit') afterHit();
  else if (m === 'ammoGift') giveAmmo();
  else if (m === 'arenaNext') nextArenaRound();
  else if (m === 'reveal' && G.modeT < cut.REVEAL_SEC - 1.2) G.modeT = cut.REVEAL_SEC - 1.2;
}

// —— 规则推进 ——
function addStats(d) {
  G.stats.heads += d.headshots || 0;
  G.stats.wrong += d.wrong || 0;
  G.stats.wasted += d.wasted;
  G.stats.locked = G.stats.locked || d.lockedOnce;
  G.stats.sec += d.t;
}

function afterHit() {
  const d = G.duel;
  addStats(d);
  G.metrics.roundSec.push(Math.round(d.t));
  G.results.push(d.result());
  G.attempt = 0;
  if (G.arena) {
    arenaWin();
    return;
  }
  if (G.roundIdx + 1 < G.level.rounds.length) {
    G.roundIdx += 1;
    startRound(); // 下一个点位先建好，换位置动画用它的天色
    setMode('move');
  } else if (G.daily) finishDaily();
  else finishLevel();
}

function finishLevel() {
  const lv = G.level;
  const st = G.stats;
  const check = {
    noMiss: st.wasted === 0,
    noLock: !st.locked,
    noRescue: st.rescued === 0,
    fast: st.sec <= (lv.fastSec || 999),
    head: st.heads > 0,
    noWrong: st.wrong === 0,
    oneShot: st.misses === 0,
    unseen: st.maxNotice !== undefined && st.maxNotice < 0.5,
  };
  const conds = lv.stars.map((k) => check[k]);
  const stars = 1 + conds.filter(Boolean).length;
  const rec = team.recordLevel(lv.id, stars);
  const money = team.earn('perRound', lv.rounds ? lv.rounds.length : 1) + team.earn('perStar', rec.newStars) + team.earn('perHead', lv.standoff ? 0 : st.heads);
  const S = team.state();
  const reveal = lv.boss && !S.revealed;
  if (reveal) team.reveal();
  G.resultInfo = { stars, conds, first: rec.first, money, sec: st.sec, reveal, heads: st.heads, cardUnlocked: rec.first && !lv.city && !lv.standoff ? team.unlockedCards().slice(-1)[0] : null };
  sfx('win');
  setMode('result');
}

function fail(reason) {
  G.failReason = reason;
  G.failAt = G.t;
  G.near = nearMiss(reason);
  sfx('lose');
  platform.vibrate(true);
  setMode('fail');
}

// 输在差一点：算出差多少，写在失败页上
function nearMiss(reason) {
  const d = G.duel;
  if (!d) return '';
  if (d.near) return d.near(reason);
  if (reason === 'spotted') return '巡逻就在你楼下：扇形扫过来要缩头，正下方要换窗';
  const head = scene.enemyHead(d.sc, 1);
  if (reason === 'mateDown') {
    const m = d.sc.mate;
    return '小雨只差 ' + (m.covers.length - m.next) + ' 段就过街了';
  }
  if (reason === 'dry') {
    const best = Math.min.apply(null, d.impacts.map((i) => i.dist));
    const gap = Math.max(1, Math.round(best - d.hitRadius));
    return '最近一枪离他的头' + (gap <= 15 ? '只差 ' : '还差 ') + gap + ' 点';
  }
  const aim = d.aimWorld();
  const dist = Math.hypot(aim.x - head.x, aim.y - head.y);
  const gap = Math.max(1, Math.round(dist - d.hitRadius));
  if (dist < D / 2) return '你的准星离他的头' + (gap <= 15 ? '只差 ' : '还差 ') + gap + ' 点';
  return '他就在你镜子外面一点点';
}

function giveAmmo() {
  const d = G.duel;
  d.bullets = 1;
  d.state = 'play';
  setMode('play');
}

// 对狙里发生的事 → 声音、字、震屏
function handleEvents(d) {
  while (d.events.length) {
    const ev = d.events.shift();
    if (ev.kind === 'duck') sfx('duck', 0.35);
    else if (ev.kind === 'crawl') sfx('crawl', 0.5);
    else if (ev.kind === 'shot') {
      sfx('shot');
      if (ev.result === 'wrong' || ev.result === 'decoy') { sfx('wrong'); G.shake = 0.35; }
      else if (ev.result === 'close') { G.slow = 0.5; G.say = { text: '好险！', color: '#ffd23f', t: 0.9 }; }
      else if (ev.result !== 'hit') G.shake = 0.25;
    } else if (ev.kind === 'spotted') G.say2 = { text: '枪口火光：他知道你在哪了', t: 1.3 };
    else if (ev.kind === 'aimed') { sfx('glint', 0.6); platform.vibrate(true); }
    else if (ev.kind === 'helmet') {
      sfx('enemyShot');
      platform.vibrate(true);
      G.say = { text: '头盔被打飞！他在那儿！', color: '#ffd23f', t: 1.8 };
    } else if (ev.kind === 'learned') { sfx('tick'); G.say = { text: '他记住这扇窗了！', color: '#ff8a00', t: 1.4 }; }
    else if (ev.kind === 'wings') sfx('wings', 0.5);
    else if (ev.kind === 'bossHit') {
      sfx('boom');
      G.shake = 0.4;
      G.bossHitT = 0;
      G.say = { text: ev.hp === 1 ? '最后一条命！' : '还没完！', color: '#ff4d5e', t: 1.6 };
    } else if (ev.kind === 'mateSafe') { sfx('coin'); G.say = { text: '小雨安全了！', color: '#90ee90', t: 1.4 }; }
    else if (ev.kind === 'train') sfx('crawl', 0.7);
    else if (ev.kind === 'kill') {
      sfx(ev.head ? 'boom' : 'enemyShot', 0.7);
      G.say = { text: (ev.head ? '爆头！' : '命中！') + (ev.left > 0 ? ' 还剩 ' + ev.left + ' 个' : ''), color: ev.head ? '#ffd23f' : '#f4f1de', t: 1.2 };
    } else if (ev.kind === 'lampOff') { sfx('wrong', 0.5); G.say = { text: '灯灭了：他们看不见你', color: '#90ee90', t: 1.4 }; }
    else if (ev.kind === 'drawGun') sfx('glint', 0.4);
    else if (ev.kind === 'squad') {
      sfx(ev.id === 'beret' ? 'crawl' : 'duck', 0.6);
      G.say2 = { text: ev.id === 'beret' ? '贝雷帽摸过去了：巡逻停下找人' : '诱饵兵举起钢盔……', t: 1.4 };
    } else if (ev.kind === 'decoyShot') { sfx('enemyShot'); G.say = { text: '他上钩了！火光在那儿！', color: '#ffd23f', t: 1.6 }; }
    else if (ev.kind === 'patrolIn') { sfx('tick'); G.say2 = { text: '又来一队巡逻', t: 1.3 }; }
    else if (ev.kind === 'patrolBack') G.say2 = { text: '巡逻又走起来了', t: 1.2 };
    else if (ev.kind === 'smoke') { sfx('duck', 0.6); G.say2 = { text: '他扔了烟雾弹', t: 1.2 }; }
  }
}

// 连续的声音：红圈靠近滴滴、锁定圈转、心跳
function ambientSound(d) {
  if (d.state !== 'play') return;
  if (d.searching() && !d.aimingMate() && d.exposed()) {
    const dist = d.seekDist();
    // 耳机卡 / 观察手小雨：红圈离你还远就开始滴滴（只帮你保命，不告诉你他在哪）
    const warn = d.mods.peekCue ? 3.5 : 2.2;
    if (d.lock > 0) sfxEvery('tick', 0.14, 0.5);
    else if (dist < warn) sfxEvery('beep', 0.25 + dist * 0.25, d.mods.peekCue ? 0.5 : 0.35);
  }
  if (d.heart > 1.25) sfxEvery('heart', 0.95 / d.heart, 0.5);
  const g = d.glint();
  if (g && !G.wasGlint) sfx('glint', 0.25);
  G.wasGlint = g;
}

function update(dt) {
  G.t += dt;
  G.modeT += dt;
  G.missFlash = Math.max(0, G.missFlash - dt);
  G.shake = Math.max(0, G.shake - dt);
  if (G.toast) {
    G.toast.t += dt;
    if (G.toast.t > 2.2) G.toast = null;
  }
  if (G.say) { G.say.t -= dt; if (G.say.t <= 0) G.say = null; }
  if (G.say2) { G.say2.t -= dt; if (G.say2.t <= 0) G.say2 = null; }
  if (G.bossHitT >= 0) { G.bossHitT += dt; if (G.bossHitT > 1.2) G.bossHitT = -1; }
  const d = G.duel;
  const m = G.mode;
  if (m === 'so') updateStandoff(dt);
  else if (m === 'soHit') { G.so.update(dt); if (G.modeT > 1.4) finishStandoff(); }
  else if (m === 'bossIntro' && G.modeT > 4) setMode('teach');
  else if (m === 'intro' && G.modeT > 1.4) setMode('play');
  else if (m === 'play') {
    // 擦身而过：慢动作
    let k = 1;
    if (G.slow > 0) { G.slow -= dt; k = 0.3; }
    d.update(dt * k);
    handleEvents(d);
    if (d.kind === 'mission') missionSound(d);
    else ambientSound(d);
    if (d.drawLeft >= 0 && d.exposed() && Math.floor(d.t * 6) !== Math.floor((d.t - dt) * 6)) platform.vibrate(false);
    if (d.state === 'hit') { sfx('boom'); setMode('hit'); }
    else if (d.state === 'dead') {
      platform.vibrate(true);
      sfx('enemyShot');
      fail('dead');
    } else if (d.state === 'dry') fail('dry');
    else if (d.state === 'timeout') fail('timeout');
    else if (d.state === 'mateDown') fail('mateDown');
    else if (d.state === 'escaped') fail('escaped');
    else if (d.state === 'spotted') { sfx('lose'); fail('spotted'); }
    else if (d.state === 'boom') { sfx('boom'); G.shake = 0.6; fail('boom'); }
  } else if (m === 'hit') {
    d.update(dt);
    if (G.modeT > 1.5) afterHit();
  } else if (m === 'move' && G.modeT > cut.RELOCATE_SEC) setMode('intro');
  else if (m === 'ad' && G.modeT > config.fakeAdSec) adDone();
  else if (m === 'ammoGift' && G.modeT > 1.4) giveAmmo();
  else if (m === 'arenaNext' && G.modeT > 1.8) nextArenaRound();
  else if (m === 'classic') G.classic.update(dt);
  else if (m === 'rescue' && G.modeT > cut.RESCUE_SEC) {
    addStats(G.duel);
    G.metrics.retrySec.push(+(G.t - G.failAt - cut.RESCUE_SEC).toFixed(2));
    G.rescuesLeft -= 1;
    G.stats.rescued += 1;
    G.attempt += 1;
    startRound(); // 拉起来以后重打这个回合，对面换个地方藏
    setMode('play');
  }
  // 结算页：星星和金币的声音
  if (m === 'result' && G.resultInfo) {
    [0.6, 1.0, 1.4].forEach((at, i) => {
      if (i < G.resultInfo.stars && G.modeT >= at && G.modeT - dt < at) sfx('star');
    });
    if (G.modeT >= 1.9 && G.modeT - dt < 1.9) sfx('coin');
  }
}

// 目标关的声音：心跳、倒计时滴答
function missionSound(d) {
  if (d.state !== 'play') return;
  if (d.heart > 1.25) sfxEvery('heart', 0.95 / d.heart, 0.5);
  if ((d.fuse >= 0 && d.fuse < 8) || (d.drawLeft >= 0 && d.drawLeft < 3 && d.exposed())) sfxEvery('tick', 0.5, 0.5);
}

function adDone() {
  if (G.adFor === 'ammo') {
    G.ammoAdsLeft -= 1;
    setMode('ammoGift');
  } else setMode('rescue');
}

function callTeammate(forWhat) {
  G.adFor = forWhat;
  const real = platform.showRewardedAd(
    config.rewardedAdUnitId,
    adDone,
    () => setMode('fail')
  );
  if (!real) setMode('ad');
  else setMode('adWait');
}

// —— 画：狙击镜 ——
function drawScope(opt) {
  const d = G.duel;
  const ctx = P.ctx;
  ctx.save();
  ctx.beginPath();
  ctx.arc(scopeC.x, scopeC.y, D / 2, 0, Math.PI * 2);
  ctx.clip();
  const cam = opt.cam || d.cam;
  scene.draw(ctx, d.sc, cam, scopeC.x, scopeC.y, D, {
    glint: d.glint(),
    barrel: d.barrel(),
    tap: d.tapping(),
    fog: d.fog,
    enemyDrop: opt.enemyDrop || 0,
    t: G.t,
  });

  // 每一枪的弹孔：打在哪儿都看得见
  d.impacts.forEach((imp) => {
    if (imp.kind === 'hit') return;
    const ix = scopeC.x + imp.x - cam.x;
    const iy = scopeC.y + imp.y - cam.y;
    const age = d.t - imp.t;
    if (age < 0.5) {
      ctx.strokeStyle = 'rgba(240,225,200,' + (1 - age * 2).toFixed(2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(ix, iy, 4 + age * 30, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = '#120c1c';
    ctx.beginPath();
    ctx.arc(ix, iy, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#120c1c';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = k * 1.7 + 0.4;
      ctx.moveTo(ix + Math.cos(a) * 3, iy + Math.sin(a) * 3);
      ctx.lineTo(ix + Math.cos(a) * 7, iy + Math.sin(a) * 7);
    }
    ctx.stroke();
  });

  if (G.missFlash > 0) {
    ctx.fillStyle = 'rgba(255,220,120,' + (G.missFlash * 0.5).toFixed(2) + ')';
    ctx.fillRect(scopeC.x - D / 2, scopeC.y, D, D / 2);
  }

  const vg = ctx.createRadialGradient(scopeC.x, scopeC.y, D * 0.3, scopeC.x, scopeC.y, D / 2);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,5,20,0.55)');
  ctx.fillStyle = vg;
  ctx.fillRect(scopeC.x - D / 2, scopeC.y - D / 2, D, D);

  // 他开枪的火光（打飞了你的诱饵头盔）：把他自己照出来
  if (d.flashSec > 0) {
    const h = scene.enemyHead(d.sc, 1);
    const k = Math.min(1, d.flashSec / 1.6);
    starburst(ctx, scopeC.x + h.x - cam.x, scopeC.y + h.y - cam.y, 26 * k + 6, 12 * k + 4, 9, '#ffe14f');
  }

  // 他正在瞄你：镜子边缘一圈红光一闪一闪
  if (d.drawLeft >= 0 && d.state === 'play' && d.exposed()) {
    const a = 0.3 + 0.2 * Math.sin(d.t * 20);
    const rg = ctx.createRadialGradient(scopeC.x, scopeC.y, D * 0.4, scopeC.x, scopeC.y, D / 2);
    rg.addColorStop(0, 'rgba(255,0,40,0)');
    rg.addColorStop(1, 'rgba(255,0,40,' + a.toFixed(2) + ')');
    ctx.fillStyle = rg;
    ctx.fillRect(scopeC.x - D / 2, scopeC.y - D / 2, D, D);
  }

  if (!opt.noCross) drawCrosshair(ctx, scopeC.x + d.sway.x, scopeC.y + d.sway.y, d.steadiness());

  // 缩头：掩体（沙袋墙）从下往上盖住镜子
  if (d.duck > 0) drawCover(ctx, d.duck);
  if (d.moving > 0) comicText(ctx, '爬向另一扇窗……', scopeC.x, scopeC.y, 20, '#f4f1de');
  if (opt.tint) {
    ctx.fillStyle = opt.tint;
    ctx.fillRect(scopeC.x - D / 2, scopeC.y - D / 2, D, D);
  }
  ctx.restore();
  scopeRing(ctx, scopeC.x, scopeC.y, D);
}

function drawCover(ctx, k) {
  const top = scopeC.y + D / 2 - (D + 20) * clamp(k * 1.1, 0, 1);
  ctx.fillStyle = '#3a2e2a';
  ctx.fillRect(scopeC.x - D / 2, top, D, D + 40);
  ctx.strokeStyle = '#1b1530';
  ctx.lineWidth = 3;
  for (let row = 0; row < 8; row++) {
    const y = top + 10 + row * 44;
    for (let i = -1; i < 6; i++) {
      const x = scopeC.x - D / 2 + i * 76 + (row % 2) * 38;
      ctx.fillStyle = row % 2 ? '#8a7350' : '#9c8460';
      roundRect(ctx, x, y, 72, 40, 14);
      ctx.fill();
      ctx.stroke();
    }
  }
}

function scopeRing(ctx, x, y, d) {
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#2b2438';
  ctx.beginPath();
  ctx.arc(x, y, d / 2 + 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#6d6380';
  ctx.beginPath();
  ctx.arc(x, y, d / 2 + 9, 0, Math.PI * 2);
  ctx.stroke();
}

function drawCrosshair(ctx, x, y, steadiness) {
  const color = steadiness === 'steady' ? '#e3263b' : steadiness === 'tremble' ? '#ff8a00' : '#1b1530';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(x - D / 2, y);
  ctx.lineTo(x - 8, y);
  ctx.moveTo(x + 8, y);
  ctx.lineTo(x + D / 2, y);
  ctx.moveTo(x, y - D / 2);
  ctx.lineTo(x, y - 8);
  ctx.moveTo(x, y + 8);
  ctx.lineTo(x, y + D / 2);
  ctx.stroke();
  ctx.fillStyle = color;
  for (let i = 1; i <= 4; i++) {
    ctx.fillRect(x - 1, y + 8 + i * 12, 2, 2);
    ctx.fillRect(x - 8 - i * 12, y - 1, 2, 2);
    ctx.fillRect(x + 8 + i * 12, y - 1, 2, 2);
  }
  ctx.beginPath();
  ctx.arc(x, y, 1.6, 0, Math.PI * 2);
  ctx.fill();
}

function pulse(ctx, b) {
  const k = (G.modeT * 1.4) % 1;
  ctx.strokeStyle = 'rgba(255,210,63,' + (1 - k).toFixed(2) + ')';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.r + 6 + k * 18, 0, Math.PI * 2);
  ctx.stroke();
}

function drawHud() {
  const ctx = P.ctx;
  const d = G.duel;

  // 左上：第几关、第几回合、子弹
  const lv = G.level;
  text(G.arena ? '擂台 · 连胜 ' + G.arena.streak : G.daily ? '每日挑战' : '第 ' + lv.no + ' 关 · ' + lv.name, 14, 18, 12, '#f4f1de', 'left', 800);
  if (lv.rounds.length > 1) text('回合 ' + (G.roundIdx + 1) + ' / ' + lv.rounds.length, 14, 36, 11, '#c9c2e0', 'left', 700);
  const bulletsMax = d.bulletsMax || d.round.bullets || 3;
  for (let i = 0; i < bulletsMax; i++) drawBullet(ctx, 18 + i * 14, lv.rounds.length > 1 ? 54 : 40, i < d.bullets);
  // Boss 的命
  if (d.bossHp > 0 && d.opp.phases) {
    for (let i = 0; i < d.opp.phases.length; i++) drawHeart(ctx, 26 + i * 20, 76, i < d.bossHp ? 7 : 4);
  }

  // 正中上方：倒计时
  const tl = Math.ceil(d.timeLeft);
  comicText(ctx, String(tl), L.W / 2, 34, tl <= 15 ? 30 + Math.sin(G.t * 12) * 2 : 26, tl <= 15 ? '#ff4d5e' : '#f4f1de');

  // 右上：带的临场卡
  if (G.card) {
    const c = team.CARDS.find((x) => x.id === G.card);
    const cx = L.W - 24;
    roundRect(ctx, cx - 13, 18, 26, 32, 4);
    ctx.fillStyle = '#f2d8a7';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = INK;
    ctx.stroke();
    cut.cardIcon(ctx, c.icon, cx, 34, 0.44);
  }
  // 地图条件、地图自带的遮挡
  const tags = [];
  if (d.cond) tags.push(config.conditions[d.cond].name);
  if (d.coverKind()) tags.push(config.covers[d.coverKind()].name);
  if (tags.length) text(tags.join(' · '), L.W - 46, 34, 11, '#c9c2e0', 'right', 800);

  const mission = d.kind === 'mission';
  if (d.drawLeft >= 0 && G.mode !== 'brief') {
    const sec = mission ? ' ' + d.drawLeft.toFixed(1) : '';
    comicText(ctx, d.exposed() ? '他瞄准你了！' + sec : mission ? '缩着：他找不到你' : '他盯着你的窗口', scopeC.x, scopeC.y - D / 2 + 30, d.exposed() ? 24 : 18, '#ff4d5e');
  }
  if (mission) drawMissionHud(ctx, d);
  else drawPanel(ctx, d);

  // 左下：缩头按钮。点一下 = 缩一下再起来（画面会变）；按住 = 一直缩着（目标关只有「一枪定生死」有）
  if (!mission || d.canDuck) {
  ctx.beginPath();
  ctx.arc(eyeBtn.x, eyeBtn.y, eyeBtn.r, 0, Math.PI * 2);
  ctx.fillStyle = d.duck > 0.5 ? '#6b5a3a' : '#3a3150';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
  drawDuckIcon(ctx, eyeBtn.x, eyeBtn.y, d.duck);
  }
  if (!mission) drawSquad(ctx, d);
  // 右下：扳机。按住屏息，松手开枪
  const st = d.steadiness();
  ctx.beginPath();
  ctx.arc(trigBtn.x, trigBtn.y, trigBtn.r, 0, Math.PI * 2);
  ctx.fillStyle = st === 'steady' ? '#c2263a' : st === 'tremble' ? '#d9730d' : st === 'settling' ? '#7a2d45' : st === 'recover' ? '#26203a' : '#3a3150';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = INK;
  ctx.stroke();
  drawCrossIcon(ctx, trigBtn.x, trigBtn.y, 20);
  if (d.reloadSec > 0) {
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#f4f1de';
    ctx.beginPath();
    ctx.arc(trigBtn.x, trigBtn.y, trigBtn.r - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - d.reloadSec / (config.shot.reloadSec * d.mods.reloadMul)));
    ctx.stroke();
  }

  const beat = Math.pow(Math.max(0, Math.sin(d.t * Math.PI * 2 * (1.1 * d.heart))), 8);
  drawHeart(ctx, trigBtn.x - trigBtn.r - 6, trigBtn.y - trigBtn.r + 2, 9 + beat * 3);

  if (G.level.index === 0 && G.mode === 'play' && !mission) {
    if (d.blinks < 3) pulse(ctx, eyeBtn);
    else if (d.shots === 0 && !d.holding) pulse(ctx, trigBtn);
  }
  if (mission && G.level.index === 0 && G.mode === 'play' && G.zoom && d.shots === 0 && !d.holding) pulse(ctx, trigBtn);
  // 第 3 关教换窗：他记住你以后，下面那栋楼一闪一闪
  if (G.mode === 'play' && d.peeks >= config.learn.warnAt && d.moving <= 0) {
    const k = (G.t * 1.4) % 1;
    roundRect(ctx, panelR.x - 4 - k * 6, panelR.y - 4 - k * 6, panelR.w + 8 + k * 12, panelR.h + 8 + k * 12, 10);
    ctx.strokeStyle = 'rgba(255,138,0,' + (1 - k).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  // 掩护关：小雨的状态
  const mate = d.sc.mate;
  if (mate && G.mode === 'play') {
    const mx = L.W / 2 - 60;
    const my = panelR.y + panelR.h + 10;
    text(mate.done ? '小雨安全了' : mate.down ? '' : d.aimingMate() ? '他在瞄小雨！' : '小雨' + (mate.state === 'run' ? '在跑' : '躲着'), mx - 6, my + 5, 11, d.aimingMate() ? '#ff4d5e' : '#90ee90', 'right', 800);
    roundRect(ctx, mx, my, 120, 10, 5);
    ctx.fillStyle = '#2b2438';
    ctx.fill();
    roundRect(ctx, mx, my, 120 * (mate.done ? 1 : mate.next / mate.covers.length), 10, 5);
    ctx.fillStyle = '#2e86ab';
    ctx.fill();
    if (mate.lock > 0 && !mate.done) {
      roundRect(ctx, mx, my + 13, 120 * mate.lock, 5, 2);
      ctx.fillStyle = '#ff4d5e';
      ctx.fill();
    }
  }

  if (G.missFlash > 0 && G.lastShot) {
    const words = { covered: '他缩着！', close: '差一点！', miss: '偏了！', decoy: '是假人！-8秒', wrong: '打错人！-8秒', car: '打在车上！', lamp: '灯灭了！' };
    comicText(ctx, words[G.lastShot.kind] || '偏了！', scopeC.x, scopeC.y + D / 2 - 44, 28, G.lastShot.kind === 'close' ? '#ffd23f' : '#ff4d5e');
    if (!d.mods.silent && !mission) comicText(ctx, '枪口火光：他看见你了', scopeC.x, scopeC.y + D / 2 - 16, 14, '#f4f1de');
  }
  if (G.say && G.mode === 'play') comicText(ctx, G.say.text, scopeC.x, scopeC.y + 40, 22, G.say.color);
  // Boss 挨了一枪：头盔飞出去
  if (G.bossHitT >= 0 && d.hitAt) {
    const k = G.bossHitT;
    const hx = scopeC.x + d.hitAt.x - d.cam.x + k * 90;
    const hy = scopeC.y + d.hitAt.y - d.cam.y - k * 120 + k * k * 160;
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(k * 8);
    ctx.fillStyle = '#6b7f4a';
    ctx.beginPath();
    ctx.arc(0, 0, 12, Math.PI, 0);
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.restore();
  }
  if (G.say2 && G.mode === 'play' && !G.missFlash) comicText(ctx, G.say2.text, scopeC.x, scopeC.y + D / 2 - 30, 18, '#ff4d5e');
}

// 目标关：镜子下面写目标那句话、还剩几个、炸弹倒计时；放大时右下角有「全景」按钮
function drawMissionHud(ctx, d) {
  const y = (G.zoom ? scopeC.y + D / 2 : WIDE.y + WIDE.h) + 36;
  roundRect(ctx, 20, y, L.W - 40, 40, 10);
  ctx.fillStyle = '#f2d8a7';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  const total = d.targets.length + (d.sc.vehicle ? 1 : 0);
  const left = d.targetsLeft() + (d.sc.vehicle && !d.sc.vehicle.down ? 1 : 0);
  text(briefText(d.M), L.W / 2, y + 14, 13, INK, 'center', 900);
  const sub = [];
  if (total > 1) sub.push('还剩 ' + left + ' / ' + total);
  if (d.fuse >= 0) sub.push('炸弹 ' + d.fuse.toFixed(1) + ' 秒');
  if (d.sc.lamp) sub.push(d.sc.lamp.on ? '探照灯亮着' : '灯灭了');
  if (sub.length) text(sub.join(' · '), L.W / 2, y + 31, 11, d.fuse >= 0 && d.fuse < 8 ? '#c2263a' : '#7a4a2a', 'center', 800);
  if (G.zoom && G.mode === 'play') {
    ctx.beginPath();
    ctx.arc(zoomBtn.x, zoomBtn.y, zoomBtn.r, 0, Math.PI * 2);
    ctx.fillStyle = '#2b2438';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#f4f1de';
    ctx.stroke();
    text('全景', zoomBtn.x, zoomBtn.y + 1, 12, '#f4f1de', 'center', 900);
  }
}

// 你这栋楼（从他那边看过来）：一格一扇窗，黄框是你。红圈 = 他的镜子正在看哪
function drawPanel(ctx, d) {
  const p = panelR;
  const cw = (p.w - 20) / d.COLS;
  const ch = (p.h - 22) / d.ROWS;
  const cx = (c) => p.x + 10 + cw * (c + 0.5);
  const cy = (r) => p.y + 16 + ch * (r + 0.5);
  const aiming = d.drawLeft >= 0;
  roundRect(ctx, p.x, p.y, p.w, p.h, 8);
  const warn = d.mods.peekCue && d.searching() && !d.aimingMate() && d.seekDist() < 3.5;
  ctx.fillStyle = aiming && Math.sin(d.t * 18) > 0 ? '#5a1a2a' : warn && Math.sin(d.t * 10) > 0 ? '#3a2030' : '#2b2438';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.fillStyle = '#c9c2e0';
  ctx.font = '700 10px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const label = aiming ? '他瞄着你！' : d.aimingMate() ? '他在瞄小雨，没看你' : d.searching() ? '你这栋楼 · 他在找你（点别的窗 = 换窗）' : '你这栋楼 · 他缩着，没在看';
  ctx.fillText(label, p.x + 10, p.y + 9);
  // 窗户
  for (let r = 0; r < d.ROWS; r++) {
    for (let c = 0; c < d.COLS; c++) {
      const me = c === d.me.c && r === d.me.r && d.moving <= 0;
      ctx.fillStyle = me ? (d.exposed() ? '#ffd23f' : '#8a7350') : '#1a1428';
      ctx.fillRect(cx(c) - cw * 0.28, cy(r) - ch * 0.32, cw * 0.56, ch * 0.64);
      // 他记住这扇窗了：橙色框
      if (me && d.peeks >= config.learn.warnAt) {
        ctx.strokeStyle = '#ff8a00';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx(c) - cw * 0.34, cy(r) - ch * 0.4, cw * 0.68, ch * 0.8);
      }
      if (me && d.exposed()) {
        ctx.fillStyle = INK;
        ctx.beginPath();
        ctx.arc(cx(c), cy(r) - 2, Math.min(5, ch * 0.18), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  // 正在爬向另一扇窗
  if (d.moving > 0 && d.moveTo) {
    const k = 1 - d.moving / config.move.sec;
    const fx = lerp(cx(d.moveTo.from.c), cx(d.moveTo.c), k);
    const fy = lerp(cy(d.moveTo.from.r), cy(d.moveTo.r), k);
    ctx.strokeStyle = '#ffd23f';
    ctx.setLineDash && ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(cx(d.moveTo.from.c), cy(d.moveTo.from.r));
    ctx.lineTo(cx(d.moveTo.c), cy(d.moveTo.r));
    ctx.stroke();
    ctx.setLineDash && ctx.setLineDash([]);
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  // 锁定圈：转满他就瞄准你
  if (d.lock > 0) {
    ctx.strokeStyle = '#ff4d5e';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx(d.me.c), cy(d.me.r), Math.min(cw, ch) * 0.62, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * d.lock);
    ctx.stroke();
  }
  // 他的镜子
  const sx = cx(d.seek.x);
  const sy = cy(d.seek.y);
  const rr = Math.min(cw, ch) * 0.75;
  if (d.aimingMate()) {
    // 他瞄着街上的小雨：红圈不在你楼上
  } else if (d.searching() || aiming) {
    ctx.strokeStyle = '#ff4d5e';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sx, sy, rr, 0, Math.PI * 2);
    ctx.moveTo(sx - rr - 4, sy);
    ctx.lineTo(sx + rr + 4, sy);
    ctx.moveTo(sx, sy - rr - 4);
    ctx.lineTo(sx, sy + rr + 4);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(200,190,220,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(sx, sy, rr, 0, Math.PI * 2);
    ctx.stroke();
  }
  drawPatrols(ctx, d, cx, cw);
}

// 二战样机：楼下街上的巡逻 + 抬头看的扇形视野（近的一段深、远的一段浅）+ 警报条
function drawPatrols(ctx, d, cx, cw) {
  if (!d.patrols || !d.patrols.length) return;
  const p = panelR;
  const P = config.patrol;
  const footY = p.y + p.h + 12;
  d.patrols.forEach((pt) => {
    if (!pt.active) return;
    const x = clamp(cx(pt.x), p.x - 8, p.x + p.w + 8);
    if (pt.stun <= 0 && pt.x > -0.5 && pt.x < d.COLS - 0.5) {
      const sees = d.patrolSees(pt);
      ctx.fillStyle = sees ? 'rgba(255,77,94,0.32)' : 'rgba(255,214,90,0.2)';
      ctx.beginPath();
      ctx.moveTo(x, footY - 10);
      ctx.lineTo(x - P.coneCols * cw - cw * 0.5, p.y + 14);
      ctx.lineTo(x + P.coneCols * cw + cw * 0.5, p.y + 14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = sees ? 'rgba(255,77,94,0.35)' : 'rgba(255,214,90,0.28)';
      ctx.fillRect(x - cw * 0.5, p.y + 14, cw, footY - 10 - p.y - 14);
    }
    // 巡逻兵：灰绿军装、钢盔；被放倒时躺着冒「zz」
    ctx.save();
    ctx.translate(x, footY);
    if (pt.stun > 0) {
      ctx.fillStyle = '#5a6a4a';
      ctx.fillRect(-8, -4, 16, 5);
      text('zz', 10, -10, 10, '#c9c2e0', 'left', 900);
    } else {
      const step = Math.sin(d.t * 8) * (pt.pause > 0 ? 0 : 2);
      ctx.strokeStyle = '#3a4430';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-1.5, -6);
      ctx.lineTo(-1.5 + step, 0);
      ctx.moveTo(1.5, -6);
      ctx.lineTo(1.5 - step, 0);
      ctx.stroke();
      ctx.fillStyle = '#5a6a4a';
      ctx.fillRect(-4, -14, 8, 8);
      ctx.beginPath();
      ctx.arc(0, -16, 4.5, Math.PI, 0);
      ctx.fill();
    }
    ctx.restore();
  });
  // 警报条
  if (d.alarm > 0.01) {
    roundRect(ctx, p.x + p.w - 96, p.y + 3, 88, 9, 4);
    ctx.fillStyle = '#1a1428';
    ctx.fill();
    roundRect(ctx, p.x + p.w - 96, p.y + 3, 88 * d.alarm, 9, 4);
    ctx.fillStyle = Math.sin(d.t * 16) > 0 ? '#ff4d5e' : '#c2263a';
    ctx.fill();
    text('警报', p.x + p.w - 100, p.y + 8, 10, '#ff4d5e', 'right', 900);
  }
}

// 二战样机：小队按钮（诱饵兵、贝雷帽），点一下放技能，右上角是剩几次
function drawSquad(ctx, d) {
  (d.squad || []).forEach((m, i) => {
    const b = squadBtns[i];
    if (!b) return;
    const used = m.charges <= 0;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = used ? '#2b2438' : '#6b5a3a';
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.save();
    ctx.translate(b.x, b.y - 3);
    ctx.globalAlpha = used ? 0.35 : 1;
    if (m.id === 'decoy') {
      // 杆子挑着钢盔
      ctx.strokeStyle = '#f4f1de';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.lineTo(0, 12);
      ctx.stroke();
      ctx.fillStyle = '#7a8a5a';
      ctx.beginPath();
      ctx.arc(0, -2, 8, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(-10, -3, 20, 2.5);
    } else {
      // 贝雷帽
      ctx.fillStyle = '#3a6a3a';
      ctx.beginPath();
      ctx.ellipse ? ctx.ellipse(0, 0, 11, 6, -0.2, 0, Math.PI * 2) : ctx.arc(0, 0, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(-4, -2, 3, 3);
    }
    ctx.restore();
    text(config.squad[m.id].name, b.x, b.y + b.r - 6, 8, '#f4f1de', 'center', 900);
    ctx.beginPath();
    ctx.arc(b.x + b.r - 4, b.y - b.r + 4, 8, 0, Math.PI * 2);
    ctx.fillStyle = used ? '#3a3150' : '#ffd23f';
    ctx.fill();
    text(String(m.charges), b.x + b.r - 4, b.y - b.r + 5, 10, INK, 'center', 900);
  });
}

function drawBullet(ctx, x, y, full) {
  ctx.fillStyle = full ? '#ffd23f' : '#3a3150';
  ctx.beginPath();
  ctx.moveTo(x - 4, y + 7);
  ctx.lineTo(x - 4, y - 3);
  ctx.quadraticCurveTo(x, y - 12, x + 4, y - 3);
  ctx.lineTo(x + 4, y + 7);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = INK;
  ctx.stroke();
}

function drawDuckIcon(ctx, x, y, k) {
  // 一个小人头 + 一道墙：缩下去时头躲到墙后
  ctx.fillStyle = '#f4f1de';
  ctx.beginPath();
  ctx.arc(x, y - 6 + k * 12, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#9c8460';
  roundRect(ctx, x - 20, y + 2, 40, 14, 5);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
}

function drawCrossIcon(ctx, x, y, s) {
  ctx.strokeStyle = '#f4f1de';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, s * 0.7, 0, Math.PI * 2);
  ctx.moveTo(x - s, y);
  ctx.lineTo(x + s, y);
  ctx.moveTo(x, y - s);
  ctx.lineTo(x, y + s);
  ctx.stroke();
}

function drawHeart(ctx, x, y, s) {
  ctx.fillStyle = '#ff4d5e';
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.2, x - s * 0.6, y - s * 1.2, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.2, x + s * 1.4, y - s * 0.2, x, y + s * 0.9);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = INK;
  ctx.stroke();
}

// —— 画：按钮和面板 ——
function button(id, label, x, y, w, h, fn, primary, disabled) {

function text(str, x, y, size, color, align, weight) {

// 漫画格：第几场、对手登场
function comicPanel(title, sub, sub2) {
  const ctx = P.ctx;
  const k = easeOut(clamp(G.modeT / 0.25, 0, 1));
  ctx.fillStyle = 'rgba(10,6,18,0.6)';
  ctx.fillRect(0, 0, L.W, L.H);
  ctx.save();
  ctx.translate(L.W / 2, L.H * 0.42);
  ctx.rotate(-0.05);
  ctx.scale(k, k);
  roundRect(ctx, -150, -80, 300, 160, 6);
  ctx.fillStyle = '#f2d8a7';
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = INK;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(200,80,60,0.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 40, Math.sin(a) * 25);
    ctx.lineTo(Math.cos(a) * 170, Math.sin(a) * 100);
    ctx.stroke();
  }
  comicText(ctx, title, 0, -22, 36);
  if (sub) text(sub, 0, 28, 16, INK, 'center', 800);

// 打中：三格漫画子弹时间。嘣 → 子弹慢慢飞过去 → 头盔飞了、眼冒金星、「爆头！」
function drawHit() {
  const ctx = P.ctx;
  const d = G.duel;
  const t = G.modeT;
  const aimX = scopeC.x + (d.hitAt.x - d.cam.x);
  const aimY = scopeC.y + (d.hitAt.y - d.cam.y);
  drawScope({ enemyDrop: t > 0.75 ? easeOut(clamp((t - 0.75) / 0.4, 0, 1)) * 14 : 0, noCross: true });
  if (t < 0.25) {
    // 第一格：嘣
    ctx.fillStyle = 'rgba(255,250,220,' + (0.8 * (1 - t / 0.25)).toFixed(2) + ')';
    ctx.fillRect(0, 0, L.W, L.H);
    starburst(ctx, scopeC.x, scopeC.y + D / 2 - 30, 70, 44, 12, '#ffd23f');
    comicText(ctx, '嘣！', scopeC.x, scopeC.y + D / 2 - 30, 40);
  } else if (t < 0.75) {
    // 第二格：子弹慢慢飞过去（速度线）
    const k = (t - 0.25) / 0.5;
    const sx = scopeC.x;
    const sy = scopeC.y + D / 2;
    const bx = sx + (aimX - sx) * k;
    const by = sy + (aimY - sy) * k;
    ctx.strokeStyle = 'rgba(255,240,200,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const a = Math.atan2(aimY - sy, aimX - sx) + Math.PI + (i - 2.5) * 0.15;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(a) * 10, by + Math.sin(a) * 10);
      ctx.lineTo(bx + Math.cos(a) * 40, by + Math.sin(a) * 40);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffe14f';
    ctx.beginPath();
    ctx.arc(bx, by, 4, 0, Math.PI * 2);
    ctx.fill();
    drawCrosshair(ctx, aimX, aimY, 'steady');
  } else {
    // 第三格：一格漫画框放大他的头：头盔飞了，眼冒金星
    const k = easeOut(clamp((t - 0.75) / 0.2, 0, 1));
    const px = L.W / 2;
    const py = scopeC.y - 20;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(-0.06);
    ctx.scale(k, k);
    roundRect(ctx, -110, -80, 220, 160, 8);
    ctx.fillStyle = '#f2d8a7';
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.beginPath();
    ctx.rect(-106, -76, 212, 152);
    ctx.clip();
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      ctx.strokeStyle = 'rgba(200,80,60,0.3)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 30, Math.sin(a) * 30);
      ctx.lineTo(Math.cos(a) * 160, Math.sin(a) * 160);
      ctx.stroke();
    }
    const tt = t - 0.75;
    ctx.fillStyle = '#4a3a5a';
    ctx.beginPath();
    ctx.arc(0, 10 + tt * 30, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-45, 36 + tt * 30, 90, 60);
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    // 头盔飞走
    ctx.save();
    ctx.translate(tt * 160, -20 - tt * 140 + tt * tt * 120);
    ctx.rotate(tt * 9);
    ctx.fillStyle = '#6b7f4a';
    ctx.beginPath();
    ctx.arc(0, 0, 30, Math.PI, 0);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    // 金星
    for (let i = 0; i < 3; i++) {
      const a = tt * 8 + (i * Math.PI * 2) / 3;
      starburst(ctx, Math.cos(a) * 34, -18 + tt * 30 + Math.sin(a) * 10, 9, 4, 5, '#ffd23f');
    }
    ctx.restore();
    const kk = easeOut(clamp((t - 0.85) / 0.2, 0, 1));
    starburst(ctx, px + 70, py + 70, 50 * kk, 32 * kk, 12, '#ff4d5e');
    comicText(ctx, d.kind === 'mission' && d.lastKill && !d.lastKill.head ? '命中！' : '爆头！', px + 70, py + 70, 28 * kk);
    if (t > 1.0) comicText(ctx, '点一下继续', L.W / 2, scopeC.y + D / 2 + 26, 12, 'rgba(244,241,222,0.7)');
  }
}

// 目标关：没打倒的目标的头在哪（失败页指给你看）
function missionTargetHead(d) {
  const v = d.sc.vehicle;
  if (v && !v.down) return people.vehicleHead(v);
  const p = d.targets.find((x) => !x.down && !x.gone) || d.targets[0];
  if (!p) return { x: d.cam.x, y: d.cam.y };
  return people.head(p);
}

// 0.8 全景：整张场景缩小，点一下 = 放大到那里（照《Sniper 3D》：先看全景，再开镜）
function drawWide() {
  const ctx = P.ctx;
  const d = G.duel;
  const k = WIDE.w / 860;
  ctx.save();
  ctx.beginPath();
  ctx.rect(WIDE.x, WIDE.y, WIDE.w, WIDE.h);
  ctx.clip();

// 目标卡上的特征图标：衣服颜色块、帽子、包……
function clueChips(ctx, clue, cx, y) {
  const chips = [];
  if (clue.shirt) chips.push({ color: people.SHIRTS[clue.shirt].color, label: people.SHIRTS[clue.shirt].name });
  if (clue.hair) chips.push({ color: people.HAIRS[clue.hair].color, label: people.HAIRS[clue.hair].name });
  if (clue.hat) chips.push({ color: '#6b4a2a', label: people.HATS[clue.hat].replace('戴', '') });
  if (clue.bag) chips.push({ color: '#5a3a20', label: people.BAGS[clue.bag].replace(/^(背着|提着)/, '') });
  if (clue.glasses) chips.push({ color: '#1b1530', label: '墨镜' });
  if (clue.phone) chips.push({ color: '#dcf0ff', label: '手机' });
  if (clue.gun) chips.push({ color: '#3a3150', label: '枪' });
  if (clue.vest) chips.push({ color: '#b5172b', label: '炸弹包' });
  const w = 78;
  chips.forEach((c, i) => {
    const x = cx + (i - (chips.length - 1) / 2) * (w + 8);
    roundRect(ctx, x - w / 2, y, w, 30, 15);
    ctx.fillStyle = '#f4f1de';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(x - w / 2 + 15, y + 15, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    text(c.label, x + 8, y + 16, 12, INK, 'center', 900);
  });
}

// 输了：他在哪 + 回放他的红圈是怎么找到你的
function drawFail() {
  const ctx = P.ctx;
  const d = G.duel;
  const head = d.kind === 'mission' ? missionTargetHead(d) : scene.enemyHead(d.sc, 1);
  const cam = d.kind === 'mission' ? { x: clamp(head.x, 30, d.sc.w - 30), y: clamp(head.y, 60, d.sc.h - 18) } : { x: clamp(head.x, D / 2, d.sc.w - D / 2), y: clamp(head.y, D / 2, d.sc.h - D / 2) };
  drawScope({ cam, noCross: true });
  const ex = scopeC.x + head.x - cam.x;
  const ey = scopeC.y + head.y - cam.y;
  ctx.strokeStyle = '#ff4d5e';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(ex, ey + 4, 22 + Math.sin(G.modeT * 6) * 3, 0, Math.PI * 2);
  ctx.stroke();
  comicText(ctx, d.kind === 'mission' ? '目标在这儿！' : '他在这儿！', ex, ey - 40, 22, '#ffffff');
  comicText(ctx, FAIL_TEXT[G.failReason] || '差一点！', L.W / 2, 34, 30, '#ff4d5e');
  // 回放：红圈走过的路
  if (d.kind !== 'mission') drawPanel(ctx, d);
  const trail = d.seekTrail;
  if (trail.length > 1) {
    const p = panelR;
    const cw = (p.w - 20) / d.COLS;
    const ch = (p.h - 22) / d.ROWS;
    const n = Math.max(2, Math.floor(trail.length * clamp(G.modeT / 2.2, 0, 1)));
    ctx.strokeStyle = 'rgba(255,77,94,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    trail.slice(0, n).forEach((pt, i) => {
      const x = p.x + 10 + cw * (pt.x + 0.5);
      const y = p.y + 16 + ch * (pt.y + 0.5);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
    text('他的镜子是这样找到你的', p.x + p.w / 2, p.y + p.h + 12, 11, '#c9c2e0', 'center', 700);
  }
  if (G.near) comicText(ctx, G.near, L.W / 2, 70, 17, '#ffd23f');
  // 激励视频只放这一刻：差一点的时候
  const by = L.H - 150;
  if (G.failReason === 'dead' && G.rescuesLeft > 0) button('rescue', '▶ 小雨拉你起来', L.W / 2 - 160, by, 150, 50, () => callTeammate('rescue'));
  if (G.failReason === 'dry' && G.ammoAdsLeft > 0) button('ammo', '▶ 小雨扔一发', L.W / 2 - 160, by, 150, 50, () => callTeammate('ammo'));
  const back = G.arena ? endArena : G.daily ? goTitle : goMap;
  button('retry', '再来', L.W / 2 + 10, by, 150, 50, G.arena ? startArena : G.daily ? startDaily : retryRound, true);
  if (G.arena) text('连胜 ' + G.arena.streak + ' · 最好 ' + Math.max(team.state().arenaBest, G.arena.streak), L.W / 2, 96, 14, '#f4f1de', 'center', 800);
  button('map', G.arena || G.daily ? '主页' : '回地图', L.W / 2 - 60, L.H - 80, 120, 42, back);
}

// —— 章节地图 ——
function drawMap() {
  const ctx = P.ctx;
  const S = team.state();
  ctx.fillStyle = '#1a1030';
  ctx.fillRect(0, 0, L.W, L.H);
  const ch = LV.CHAPTERS[0];
  comicText(ctx, ch.name, L.W / 2, 40, 26);
  const rk = team.rank();
  text('段位 ' + rk.name + ' · ★ ' + team.totalStars(), 16, 76, 13, '#ffd23f', 'left', 900);
  text('金币 ¥' + S.money, L.W - 16, 76, 13, '#ffd23f', 'right', 900);
  // 二十关排成格子：教学绿、主线蓝、特别任务红；打过的变金色
  const lvs = LV.LEVELS.filter((l) => l.chapter === ch.id);
  const cols = 4;
  const top = 108;
  const cellW = (L.W - 24) / cols;
  const cellH = Math.min(84, (L.H - top - 96) / Math.ceil(lvs.length / cols));
  const TYPE_COLOR = { 教学: '#38b000', 主线: '#3a86ff', 特别任务: '#e3263b', 样机: '#c9a227', undefined: '#c9a227' };
  let lastType = '';
  lvs.forEach((lv, i) => {
    const x = 12 + cellW * (i % cols) + cellW / 2;
    const y = top + cellH * Math.floor(i / cols) + 24;
    const open = levelUnlocked(lv);
    const stars = S.stars[lv.id] || 0;
    const r = lv.boss ? 24 : 20;
    if (lv.type !== lastType) {
      text(lv.type, x - r - 4, y - r - 6, 10, TYPE_COLOR[lv.type], 'left', 900);
      lastType = lv.type;
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = !open ? '#2b2438' : stars ? '#ffd23f' : TYPE_COLOR[lv.type] || '#e3263b';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = INK;
    ctx.stroke();
    if (open && !stars) {
      const k = (G.t * 1.2) % 1;
      ctx.strokeStyle = 'rgba(255,210,63,' + (1 - k).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(x, y, r + 4 + k * 10, 0, Math.PI * 2);
      ctx.stroke();
    }
    text(open ? (lv.boss ? '王' : String(lv.no)) : '🔒', x, y + 1, 15, open && stars ? INK : '#f4f1de', 'center', 900);
    text(lv.name, x, y + r + 11, 11, open ? '#f4f1de' : '#6d6380', 'center', 800);
    text('★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars), x, y + r + 25, 10, '#ffd23f', 'center', 800);
    G.buttons.push({ id: 'lv_' + lv.id, x: x - r, y: y - r, w: r * 2, h: r * 2, fn: () => openLevel(lv) });
  });
  // （0.9 样机的同时 / 轮流切换：精简版里没有巡逻，先不显示）
  if (false) button('mapAlt', '巡逻和对狙：' + (G.alternate ? '轮流来' : '同时来'), L.W / 2 - 120, L.H - 116, 240, 42, () => {
    G.alternate = !G.alternate;
    toast(G.alternate ? '轮流：巡逻在楼下时，对面不找你' : '同时：巡逻和对面一起压过来');

  button('mapHome', '主页', 12, L.H - 60, 104, 42, goTitle);
  if (S.revealed) button('mapTeam', '战队', L.W - 116, L.H - 60, 104, 42, () => setMode('team'));
}

// —— 过关结算：星星砸下来，金币飞进奖金栏 ——
function drawResult() {
  const ctx = P.ctx;
  const R = G.resultInfo;
  const lv = G.level;
  const S = team.state();
  const t = G.modeT;
  ctx.fillStyle = '#1a1030';
  ctx.fillRect(0, 0, L.W, L.H);
  comicText(ctx, lv.boss ? (lv.city ? '五个狙击手全倒了！' : '打败了' + config.opponents.boss.name + '！') : '过关！', L.W / 2, lv.boss && lv.city ? 66 : 70, lv.boss && lv.city ? 30 : 38);
  text('第 ' + lv.no + ' 关 · ' + lv.name + ' · 用时 ' + Math.round(R.sec) + ' 秒', L.W / 2, 112, 13, '#c9c2e0', 'center', 700);
  // 三颗星
  for (let i = 0; i < 3; i++) {
    const at = 0.6 + i * 0.4;
    const got = i < R.stars;
    const x = L.W / 2 + (i - 1) * 84;
    const yBase = 190 - (i === 1 ? 14 : 0);
    let k = got ? clamp((t - at) / 0.25, 0, 1) : 1;
    const y = got ? yBase - (1 - easeOut(k)) * 160 : yBase;
    const sz = got ? 34 * (k < 1 ? 1.3 - 0.3 * k : 1) : 30;
    starburst(ctx, x, y, sz, sz * 0.45, 5, got && k > 0 ? '#ffd23f' : '#3a3150');
  }
  // 三条星星条件
  const rows = [['过关', true]].concat(lv.stars.map((k, i) => [LV.starText(lv, k), R.conds[i]]));
  rows.forEach(([str, ok], i) => text((ok ? '✓ ' : '✗ ') + str, L.W / 2 - 110, 262 + i * 26, 14, ok ? '#90ee90' : '#9a90b0', 'left', 800));
  // 金币飞进奖金栏
  const coinT = clamp((t - 1.9) / 0.7, 0, 1);
  if (t > 1.9) {
    for (let i = 0; i < 8; i++) {
      const k = clamp(coinT * 1.4 - i * 0.06, 0, 1);
      if (k <= 0 || k >= 1) continue;
      const x = lerp(L.W / 2, L.W - 40, easeOut(k)) + Math.sin(i * 2) * 20 * (1 - k);
      const y = lerp(370, 40, easeOut(k)) - Math.sin(k * Math.PI) * 30;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = INK;
      ctx.stroke();
    }
  }
  comicText(ctx, '+¥' + R.money, L.W / 2, 370, 26, '#90ee90');
  if (R.heads) text('其中爆头 ' + R.heads + ' 次 · 每次多给 ¥' + config.money.perHead, L.W / 2, 396, 12, '#ffd23f', 'center', 800);
  text('奖金 ¥' + (t < 2.4 ? S.money - R.money : S.money), L.W - 16, 40, 14, '#ffd23f', 'right', 900);
  text('段位 ' + team.rank().name, 16, 40, 14, '#ffd23f', 'left', 900);
  if (R.cardUnlocked && t > 2.2) text('解锁新卡：' + R.cardUnlocked.name + '（' + R.cardUnlocked.desc + '）', L.W / 2, 410, 13, '#3ef0ff', 'center', 800);
  if (t < 2.2) return;
  if (R.reveal) {
    button('continue', '继续', L.W / 2 - 100, L.H - 90, 200, 56, () => setMode('reveal'), true);
    return;
  }
  const next = (lv.legacy ? LV.CAFE : lv.city ? LV.CITY_LEVELS : lv.ww2 ? LV.WW2_LEVELS : LV.LEVELS)[lv.index + 1];
  if (next && levelUnlocked(next)) button('next', '下一关', L.W / 2 + 10, L.H - 140, 150, 54, () => openLevel(next), true);
  button('again', '再打一次', next && levelUnlocked(next) ? L.W / 2 - 160 : L.W / 2 - 75, L.H - 140, 150, 54, () => openLevel(lv), !(next && levelUnlocked(next)));
  button('resMap', '回地图', L.W / 2 - 60, L.H - 72, 120, 44, goMap);
}
